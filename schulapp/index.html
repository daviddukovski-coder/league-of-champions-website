/* Layout: Dschungel-Levelkarte (Pfad von oben nach unten, Prinzessin im Käfig am Ende); jede Übung auf einer Holztafel mit Affe + Sprechblase. Bewusst nur ein Look. */
:root {
  --jungle-deep: #173d22;
  --jungle: #24572f;
  --leaf: #3f8f3a;
  --lime: #9bd35a;
  --banana: #ffd23f;
  --banana-dark: #c99a12;
  --wood: #8a5a2b;
  --wood-dark: #5d3b1a;
  --wood-light: #d9c29a;
  --paper: #fff8e6;
  --ink: #2b2113;
  --ink-soft: #6b5a3e;
  --right: #2fa84a;
  --right-bg: #e6f7df;
  --bad: #c2410c;
  --fur: #7a4a24;
  --face: #f0c99a;
  --pfur: #b0703f;
  --pface: #f7d9b5;
  --pink: #f06292;
  --l-ink: #1d63b4;
  --o-ink: #d8352a;
  --path: #e6c789;
  --font: "SchulDruck", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; font-family: var(--font); font-size: 18px; line-height: 1.35; color: var(--ink);
  background:
    radial-gradient(circle at 18% 8%, #3b7a38 0, transparent 38%),
    radial-gradient(circle at 88% 92%, #2f6c33 0, transparent 42%),
    radial-gradient(circle at 60% 50%, #1f4a28 0, transparent 60%),
    var(--jungle-deep);
  overflow-x: hidden; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--banana); outline-offset: 2px; }
.deco { position: fixed; pointer-events: none; z-index: 0; }
.deco svg { display: block; width: 100%; height: auto; }
.leaves { width: clamp(130px, 24vw, 280px); opacity: .9; }
.leaves.tl { top: 0; left: 0; } .leaves.tr { top: 0; right: 0; transform: scaleX(-1); }
.leaves.bl { bottom: 0; left: 0; transform: scaleY(-1); } .leaves.br { bottom: 0; right: 0; transform: scale(-1, -1); }
#app { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 40px; }

/* ---------- Kopfzeile ---------- */
.topbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.wood-btn {
  background: var(--wood); color: #fff; border: 3px solid var(--wood-dark); border-radius: 999px;
  padding: 6px 14px; font-weight: 700; font-size: 16px; box-shadow: 0 4px 0 var(--wood-dark);
}
.wood-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--wood-dark); }
.lvl { background: var(--banana); color: var(--ink); font-weight: 700; border-radius: 999px; padding: 4px 14px; border: 3px solid var(--banana-dark); }
.tag { font-weight: 700; font-size: 20px; padding: 2px 12px; border-radius: 10px; background: var(--paper); letter-spacing: .06em; }
.tag-L { color: var(--l-ink); } .tag-O { color: var(--o-ink); }
.tag-M .t-o { color: var(--o-ink); } .tag-M .t-l { color: var(--l-ink); }
.bcount { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; background: rgba(0,0,0,.25); color: #fff;
  border-radius: 999px; padding: 3px 12px 3px 6px; font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.bcount svg { width: 30px; height: 30px; }
.sound { background: rgba(255,255,255,.12); color: #fff; border: 2px solid rgba(255,255,255,.35); border-radius: 999px; padding: 4px 12px; font-size: 14px; }

/* ---------- Karte ---------- */
.title { text-align: center; color: #fff; margin: 4px 0 6px; }
.title .eyebrow { display: inline-block; background: var(--banana); color: var(--jungle-deep); font-weight: 700; font-size: 14px;
  letter-spacing: .14em; text-transform: uppercase; border-radius: 999px; padding: 2px 14px; }
.title h1 { margin: 6px 0 0; font-size: clamp(30px, 7vw, 46px); line-height: 1.05; text-shadow: 0 3px 0 var(--jungle-deep), 0 6px 14px rgba(0,0,0,.35); text-wrap: balance; }
.title p { margin: 6px 0 0; color: #d9efc8; font-size: 16px; }
.map { position: relative; margin: 10px auto 0; max-width: 520px; }
.map > svg.trail { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.node {
  position: absolute; transform: translate(-50%, -50%); width: 74px; height: 74px; border-radius: 50%;
  border: 5px solid var(--wood-dark); background: var(--wood); color: #fff; z-index: 2;
  display: grid; place-items: center; box-shadow: 0 6px 0 rgba(0,0,0,.35); padding: 0;
}
.node .n { font-weight: 700; font-size: 30px; line-height: 1; }
.node .pic { position: absolute; top: -12px; right: -14px; width: 34px; height: 34px; border-radius: 50%; background: var(--paper);
  display: grid; place-items: center; font-size: 20px; border: 2px solid var(--wood-dark); color: var(--ink); font-weight: 700; }
.node .pic.L { color: var(--l-ink); } .node .pic.O { color: var(--o-ink); }
.node .got { position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%); display: flex; gap: 0; }
.node .got svg { width: 22px; height: 22px; }
.node .got svg.off { opacity: .3; filter: grayscale(1); }
.node.done { background: var(--leaf); border-color: #1f5a22; }

const fresh = () => ({ trace: { O: 0, o: 0, L: 0, l: 0 }, stars: {}, passed: {}, heroAt: 0, friends: {}, freed: false, updated: 0, resetAt: 0 });
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const keyFor = name => 'affe_prog_' + (name ? name.toLowerCase() : '_gast');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function parse(s) {
  try { const o = typeof s === 'string' ? JSON.parse(s) : s; return o && o.trace ? Object.assign(fresh(), o) : null; } catch (e) { return null; }
}
// zwei Spielstände zusammenführen: es zählt immer das Bessere (außer nach einem Zurücksetzen)
function merge(a, b) {
  if (!a) return b || fresh();
  if (!b) return a;
  if ((a.resetAt || 0) > (b.updated || 0)) return a;
  if ((b.resetAt || 0) > (a.updated || 0)) return b;
  const r = fresh();
  LETTERS.forEach(k => { r.trace[k] = Math.max(a.trace[k] || 0, b.trace[k] || 0); });
  new Set([...Object.keys(a.passed), ...Object.keys(b.passed)]).forEach(id => { r.passed[id] = !!(a.passed[id] || b.passed[id]); });
  new Set([...Object.keys(a.stars), ...Object.keys(b.stars)]).forEach(id => { r.stars[id] = Math.max(a.stars[id] || 0, b.stars[id] || 0); });
  r.heroAt = Math.max(a.heroAt || 0, b.heroAt || 0);
  r.friends = Object.assign({}, a.friends, b.friends);
  r.freed = !!(a.freed || b.freed);
  r.updated = Math.max(a.updated || 0, b.updated || 0);
  r.resetAt = Math.max(a.resetAt || 0, b.resetAt || 0);
  return r;
}

// Verbindung zum Google Sheet (über Apps Script). Ohne Verbindung wird nur auf dem Gerät gespeichert.
const Cloud = (() => {
  let gas = null;
  try { gas = google.script.run ? google.script : null; } catch (e) {}
  const api = !gas && /^https:\/\/script\.google(usercontent)?\.com\//.test(CONFIG.API_URL) ? CONFIG.API_URL : '';
  function call(fn, ...args) {
    return new Promise((res, rej) => {
      const done = r => (r && r.ok ? res(r.data) : rej(new Error((r && r.error) || 'Fehler')));
      if (gas) { gas.run.withSuccessHandler(done).withFailureHandler(rej).api(fn, args); return; }
      if (!api) { rej(new Error('offline')); return; }
      const write = !/^(apiKids|apiLoad)$/.test(fn);
      const req = write
        ? fetch(api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: fn, args }) })
        : fetch(api + '?action=' + fn + '&args=' + encodeURIComponent(JSON.stringify(args)));
      req.then(r => r.json()).then(done).catch(rej);
    });
  }
  return { on: !!(gas || api), call };
})();

let cloudErr = false, syncState = '', saveTimer = 0;
function setSync(s) {
  syncState = s;
  const el = document.getElementById('sync'); if (!el) return;
  el.textContent = s === 'ok' ? '☁️ gespeichert' : s === 'saving' ? '☁️ speichert …' : s === 'err' ? '⚠️ nur auf diesem iPad' : '';
  el.className = 'sync ' + s;
}
function save() {
  state.updated = Date.now();
  lsSet(keyFor(kid), JSON.stringify(state));
  if (!kid || !Cloud.on) return;
  setSync('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    Cloud.call('apiSave', kid, JSON.stringify(state), totalBananas(), LEVELS.filter((_, i) => levelDone(i)).length)
      .then(() => setSync('ok')).catch(() => setSync('err'));
  }, 700);
}
async function refreshKids() {
  if (!Cloud.on) return;
  try { kids = await Cloud.call('apiKids'); cloudErr = false; lsSet('affe_kids', JSON.stringify(kids)); } catch (e) { cloudErr = true; }
}
async function chooseKid(name) {
  kid = name; lsSet('affe_last', name || '');
  let local = parse(lsGet(keyFor(name)));
  if (!name) local = merge(local, parse(lsGet('ool_progress_v1')));   // alter Spielstand ohne Profil
  let remote = null;
  if (name && Cloud.on) {
    app.innerHTML = `<div class="loading">${monkey('wow')}<p>Ich hole deine Bananen …</p></div>`;
    try { remote = parse(await Cloud.call('apiLoad', name)); syncState = 'ok'; } catch (e) { syncState = 'err'; }
  }
  state = merge(local, remote);
  lsSet(keyFor(name), JSON.stringify(state));
  if (name && Cloud.on && syncState === 'ok' && JSON.stringify(state) !== JSON.stringify(remote)) save();
  go('map');
}

  try {
    const c = getCtx(), t0 = c.currentTime;
    freqs.forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain(), t = t0 + i * dur;
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.03);

  } catch (e) {}
}

const Music = (() => {
  const BPM = 72, EIGHTH = 60 / BPM / 2;

    master.connect(soft); soft.connect(c.destination);
    reverb = c.createConvolver();

    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }

    dry = c.createGain(); dry.gain.value = 0.8; dry.connect(master); dry.connect(reverb);
    noise = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  }
  function env(g, t, peak, a, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function osc(c, type, f, t, dur, out) { const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.connect(out); o.start(t); o.stop(t + dur + 0.05); return o; }
  function pan(c, v) { const p = c.createStereoPanner ? c.createStereoPanner() : c.createGain(); if (p.pan) p.pan.value = v; p.connect(dry); return p; }
  function kalimba(c, m, t) { const g = c.createGain(); g.connect(pan(c, Math.random() * 0.8 - 0.4)); env(g, t, 0.07, 0.005, 1.4); osc(c, 'sine', hz(m), t, 1.5, g);

function sampleItems(ex) {
  const all = shuffle(ex.items.slice());
  if (!ex.round || all.length <= ex.round) return all;
  const groups = {}; all.forEach(it => (groups[it[2]] = groups[it[2]] || []).push(it));
  const keys = Object.keys(groups), each = Math.ceil(ex.round / keys.length), out = [];
  keys.forEach(k => out.push(...groups[k].slice(0, each)));
  all.forEach(it => { if (out.length < ex.round + keys.length && !out.includes(it)) out.push(it); });
  return shuffle(shuffle(out).slice(0, ex.round));
}
function highlight(word, ex, answer) {
  const chars = [...word];
  let test;
  if (ex.target === 'l') test = isL;
  else if (ex.target === 'o') test = isO;
  else if (ex.target === 'first') return `<span class="hl">${chars[0]}</span>${chars.slice(1).join('')}`;
  else test = c => c.toLowerCase() === answer;
  return chars.map(c => test(c) ? `<span class="hl">${c}</span>` : c).join('');

function map() {
  const N = LEVELS.length;
  // Reihenfolge auf dem Pfad: Welten mit Leveln und Käfig am Ende, dann Vorschau-Welten, ganz unten die Prinzessin
  const items = [];
  WORLDS.forEach((w, wi) => {
    items.push({ type: 'sign', text: `Welt ${wi + 1} · ${w.name}` });
    LEVELS.forEach((L, i) => { if (L.world === wi) items.push({ type: 'level', i }); });
    items.push({ type: 'friend', wi });
  });
  COMING.forEach((name, ci) => { items.push({ type: 'sign', text: `Welt ${WORLDS.length + ci + 1} · ${name}`, soon: true }, { type: 'soon' }, { type: 'soon' }); });
  items.push({ type: 'princess' });
  let y = 70, k = 0;
  const pts = [];
  items.forEach(it => {
    if (it.type === 'sign') { y += 46; it.y = y; return; }
    y += it.type === 'friend' ? 120 : it.type === 'princess' ? 150 : it.type === 'soon' ? 92 : 112;
    let x = 50 + 30 * Math.sin(k * 1.05 + 0.4); k++;
    if (it.type === 'friend' || it.type === 'princess') x = Math.max(36, Math.min(64, x));
    it.x = x; it.y = y; pts.push(it);
  });
  items.forEach((it, n) => { if (it.type === 'sign') { const nx = items.slice(n + 1).find(o => o.type !== 'sign'); it.y = nx.y - 64; it.x = nx.x > 50 ? 28 : 72; } });
  const H = y + 260;
  const curve = arr => arr.slice(1).reduce((acc, p, n) => { const q = arr[n], m = (p.y - q.y) / 2;

  const soonFrom = pts.findIndex(p => p.type === 'soon');

      ${done ? `<span class="got">${Array.from({ length: 3 }, (_, n) => BANANA.replace('<svg ', `<svg class="${n < levelBananas(i) ? '' : 'off'}" `)).join('')}</span>` : ''}</button>`;
  }).join('');
  const saved = WORLDS.map((w, wi) => worldDone(wi) ? `<span class="fhead" title="${w.friend.name}">${monkey('happy', friendLook(w.friend))}</span>` : '').join('');

    <header class="title"><span class="eyebrow">Affenklasse</span><h1>Affen-Abenteuer</h1>

  wireMusic(); setSync(syncState);

/* ================= Schreibrichtung ================= */
function trace(lv) {
  const letter = LEVELS[lv].letter;
  const names = { O: 'das große O', o: 'das kleine o', L: 'das große L', l: 'das kleine l' };
  const sayText = `Spure ${names[letter]} nach. Beginne beim grünen Punkt und folge dem Pfeil.`;
  const body = board(lv, `Spure <span class="${isO(letter) ? 'r' : 'b'}" style="font-size:1.3em">${letter}</span> nach. Beginne beim <span class="g">grünen Punkt</span> und folge dem Pfeil.`, sayText, { noLives: true });
  body.innerHTML = `<div class="canvas-wrap"><canvas aria-label="Schreibfeld für ${letter}"></canvas></div>
    <div class="msg" id="msg"></div>
    <div class="trace-bar"><span id="tbn"></span>
      <div class="btn-row"><button class="btn" id="demo">▶ Zeig es mir</button><button class="btn" id="clear">Löschen</button></div></div>
    <div class="btn-row" id="after"></div>`;
  const canvas = body.querySelector('canvas'), ctx = canvas.getContext('2d');
  const msg = body.querySelector('#msg'), tbn = body.querySelector('#tbn'), after = body.querySelector('#after');
  let W = 0, H = 0, G = null, ink = [], cur = null, prog = { s: 0, i: 0 }, busy = false, demoRaf = 0, msgTimer = 0;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function geometry() {
    const T = H * 0.12, B = H * 0.86, M = T + (B - T) * 0.47, cx = W / 2;
    const strokes = [];
    const ell = (cy, rx, ry) => { const pts = [], n = Math.max(60, Math.round(2 * Math.PI * Math.max(rx, ry) / 5));
      for (let k = 0; k <= n; k++) { const t = -Math.PI / 2 - (k / n) * Math.PI * 2; pts.push([cx + rx * Math.cos(t), cy + ry * Math.sin(t)]); } return pts; };
    const line = (a, b) => { const n = Math.max(10, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / 5)), pts = [];
      for (let k = 0; k <= n; k++) pts.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]); return pts; };
    const h = B - T;
    if (letter === 'O') strokes.push(ell((T + B) / 2, h * 0.4, h / 2));
    if (letter === 'o') strokes.push(ell((M + B) / 2, (B - M) * 0.5, (B - M) / 2));
    if (letter === 'L') { const x0 = cx - h * 0.24, x1 = cx + h * 0.26; strokes.push(line([x0, T], [x0, B]), line([x0, B], [x1, B])); }
    if (letter === 'l') {
      // österreichische Druckschrift: Abstrich von oben, unten Bogen nach rechts
      const r = h * 0.17, x = cx - r * 0.6, pts = line([x, T], [x, B - r]);
      const a0 = Math.PI, a1 = Math.PI / 2 - Math.PI / 7, n = 24;
      for (let k = 1; k <= n; k++) { const a = a0 + (a1 - a0) * k / n; pts.push([x + r + r * Math.cos(a), B - r + r * Math.sin(a)]); }
      strokes.push(pts);
    }
    const gw = Math.max(16, H * 0.075);
    return { T, M, B, strokes, gw, tol: Math.max(26, gw * 1.15) };
  }
  function resize() {
    const r = canvas.parentElement.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    W = r.width; H = Math.min(W * 0.72, 420);
    canvas.style.height = H + 'px'; canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    G = geometry(); ink = []; prog = { s: 0, i: 0 }; draw();
  }
  function poly(pts, from, to) { ctx.beginPath(); ctx.moveTo(pts[from][0], pts[from][1]); for (let k = from + 1; k <= to; k++) ctx.lineTo(pts[k][0], pts[k][1]); ctx.stroke(); }
  function arrow(pts, at, color, size) {
    const a = pts[at], b = pts[Math.min(pts.length - 1, at + 3)], ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    ctx.save(); ctx.translate(a[0], a[1]); ctx.rotate(ang); ctx.fillStyle = color; ctx.beginPath();
    ctx.moveTo(size, 0); ctx.lineTo(-size * 0.7, -size * 0.75); ctx.lineTo(-size * 0.7, size * 0.75); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  function draw(demo) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#e4eed3'; ctx.fillRect(0, G.M, W, G.B - G.M);
    ctx.strokeStyle = '#8fa0c8'; ctx.lineWidth = 1.5;
    [G.T, G.M, G.B].forEach(y => { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); });
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    G.strokes.forEach(pts => { ctx.strokeStyle = '#cdd1d9'; ctx.lineWidth = G.gw; poly(pts, 0, pts.length - 1); });
    G.strokes.forEach((pts, s) => {
      const upto = s < prog.s ? pts.length - 1 : s === prog.s ? prog.i : 0;
      if (upto > 0) { ctx.strokeStyle = '#ffe07a'; ctx.lineWidth = G.gw; poly(pts, 0, upto); }
    });
    G.strokes.forEach((pts, s) => {
      const n = pts.length; const marks = isO(letter) ? [0.16, 0.42, 0.68] : [0.45];
      marks.forEach(f => arrow(pts, Math.floor(n * f), '#2f63c5', G.gw * 0.42));
      const p = pts[0]; ctx.fillStyle = '#2fa84a'; ctx.beginPath(); ctx.arc(p[0], p[1], G.gw * 0.62, 0, Math.PI * 2); ctx.fill();
      if (G.strokes.length > 1) { ctx.fillStyle = '#fff'; ctx.font = `700 ${Math.round(G.gw * 0.8)}px SchulDruck, sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(s + 1), p[0] + (s === 1 ? 1 : 0), p[1] + 1); }
    });
    ctx.strokeStyle = demo ? '#2a8fd6' : '#5d3b1a'; ctx.lineWidth = Math.max(7, G.gw * 0.42);
    ink.forEach(l => { if (l.length > 1) { ctx.beginPath(); ctx.moveTo(l[0][0], l[0][1]); l.forEach(p => ctx.lineTo(p[0], p[1])); ctx.stroke(); }
      else if (l.length === 1) { ctx.fillStyle = ctx.strokeStyle; ctx.beginPath(); ctx.arc(l[0][0], l[0][1], ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill(); } });
  }
  function note(text, kind) {
    msg.textContent = text; msg.className = 'msg ' + (kind || '');
    clearTimeout(msgTimer); if (kind === 'bad') msgTimer = setTimeout(() => { msg.textContent = ''; }, 2600);
  }
  function showProgress() {
    tbn.innerHTML = bananaRow(state.trace[letter], NEED);
    document.getElementById('bc').textContent = totalBananas();
    after.innerHTML = '';
    if (state.trace[letter] >= NEED) {
      const ns = nextStep(lv);
      after.innerHTML = `<button class="btn" id="tomap">🗺️ Zur Karte</button><button class="btn primary" id="nx">${ns.label}</button>`;
      after.querySelector('#tomap').onclick = () => go('map');
      after.querySelector('#nx').onclick = ns.fn;
    }
  }
  function fail(text) {
    busy = true; sBad(); mood('sad'); note(text, 'bad'); shake(canvas.parentElement);
    setTimeout(() => { ink = []; prog = { s: 0, i: 0 }; cur = null; busy = false; draw(); }, 650);
  }
  function success() {
    busy = true; cur = null; prog = { s: G.strokes.length, i: 0 }; draw();
    const before = state.trace[letter];
    state.trace[letter] = Math.min(NEED, before + 1); save();
    const doneNow = before < NEED && state.trace[letter] >= NEED;
    mood('happy');
    if (doneNow) { sWin(); note('Level geschafft! 3 Bananen für dich!', 'good'); say('Super! Level geschafft!'); bananaRain(10); }
    else { sGood(); note(state.trace[letter] >= NEED ? 'Super, nochmal geübt!' : 'Richtig! Hol dir die nächste Banane!', 'good'); }
    showProgress();
    setTimeout(() => { ink = []; prog = { s: 0, i: 0 }; busy = false; draw(); }, 900);
  }
  const dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
  function pos(e) { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  function step(p) {
    const pts = G.strokes[prog.s], n = pts.length;
    let best = -1;
    for (let j = prog.i; j <= Math.min(n - 1, prog.i + 6); j++) if (dist(p, pts[j]) < G.tol * 0.85) best = j;
    const nearWindow = best >= 0 || pts.slice(Math.max(0, prog.i - 4), prog.i + 1).some(q => dist(p, q) < G.tol);
    if (best > prog.i) prog.i = best;
    if (!nearWindow) {
      let minD = Infinity, ahead = false;
      pts.forEach((q, k) => { const dd = dist(p, q); minD = Math.min(minD, dd); if (k > prog.i + 12 && dd < G.tol * 0.8) ahead = true; });
      if (ahead) return fail('Andere Richtung! Folge dem Pfeil.');
      if (minD > G.tol * 1.6) return fail('Bleib auf der grauen Spur!');
    }
    // fertig erst, wenn der Finger wirklich am Ende der Spur angekommen ist
    if (prog.i >= n - 2 && dist(p, pts[n - 1]) < Math.max(16, G.gw * 0.8)) {
      if (prog.s === G.strokes.length - 1) return success();
      prog.s++; prog.i = 0;
    }
  }
  canvas.onpointerdown = e => {
    if (busy) return; e.preventDefault();
    const p = pos(e), pts = G.strokes[prog.s];
    if (dist(p, pts[prog.i]) > G.tol * 1.4 && !(prog.i > 0 && pts.slice(Math.max(0, prog.i - 6), prog.i + 6).some(q => dist(p, q) < G.tol))) {
      sBad();
      note(prog.i === 0 ? (prog.s === 0 ? 'Beginne beim grünen Punkt!' : 'Jetzt Strich 2: beim grünen Punkt 2 beginnen!') : 'Mach dort weiter, wo du aufgehört hast!', 'bad');
      return;
    }
    try { canvas.setPointerCapture(e.pointerId); } catch (er) {}
    msg.textContent = ''; cur = [p]; ink.push(cur); step(p); if (!busy) draw();
  };
  canvas.onpointermove = e => {
    if (!cur || busy) return; e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) { const p = pos(ev); cur.push(p); step(p); if (busy) return; }
    draw();
  };
  canvas.onpointerup = canvas.onpointercancel = () => { cur = null; };
  body.querySelector('#clear').onclick = () => { if (busy) return; ink = []; prog = { s: 0, i: 0 }; msg.textContent = ''; draw(); };
  body.querySelector('#demo').onclick = () => demo(false);
  function demo(auto) {
    if (busy) return; busy = true; ink = []; prog = { s: 0, i: 0 }; msg.textContent = '';
    if (!auto) say(names[letter].replace('das ', '').replace(/^./, c => c.toUpperCase()) + '. So geht es.');
    const all = G.strokes.map(s => s.slice());
    if (reduce) { ink = all; draw(true); setTimeout(() => { ink = []; busy = false; draw(); }, 1500); return; }
    let s = 0, k = 0; ink = [[]]; const speed = Math.max(1, Math.round(all[0].length / 70));
    const tick = () => {
      for (let r = 0; r < speed; r++) {
        if (k < all[s].length) ink[ink.length - 1].push(all[s][k++]);
        else if (s < all.length - 1) { s++; k = 0; ink.push([]); }
      }
      draw(true);
      const last = ink[ink.length - 1]; const head = last[last.length - 1];
      if (head) { ctx.save(); ctx.translate(head[0], head[1]); ctx.rotate(-0.4); ctx.font = `${Math.round(G.gw * 1.6)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🍌', 0, 0); ctx.restore(); }
      if (s === all.length - 1 && k >= all[s].length) { setTimeout(() => { ink = []; busy = false; draw(); }, 700); return; }
      demoRaf = requestAnimationFrame(tick);
    };
    demoRaf = requestAnimationFrame(tick);
  }
  window.addEventListener('resize', resize);
  cleanup = () => { window.removeEventListener('resize', resize); cancelAnimationFrame(demoRaf); };
  resize(); showProgress();
  say(sayText);
  if (state.trace[letter] === 0) setTimeout(() => demo(true), 400);
}

/* ================= Bild-Aufgaben (Ring / Auswahl) ================= */
function runItems(ex, lv) {
  const body = board(lv, ex.instr, ex.say);
  const items = sampleItems(ex);
  let idx = 0, errs = 0, stuck = [], trayItems = [], locked = false;
  setLives(0);
  say(ex.say);
  const wordCls = ex.tab === 'L' ? 'L' : '';
  function optHtml(k, label) {
    if (ex.mode === 'L') {
      const box = k === 'A' ? ['L', '', ''] : k === 'E' ? ['', '', 'l'] : ['L', '', 'l'];
      return `<span class="slotbox">${box.map(c => `<span>${c}</span>`).join('')}</span><span class="cap">${label}</span>`;
    }
    if (ex.mode === 'O') {
      const i = { A: 0, M: 1, E: 2 }[k];
      return `<span class="slotbox">${[0, 1, 2].map(j => `<span>${j === i ? '<i class="dot"></i>' : ''}</span>`).join('')}</span><span class="cap">${label}</span>`;
    }
    return label;
  }
  function render() {
    if (idx >= items.length) return finish(ex, errs);
    const [word, emo] = items[idx];
    const prog = `<div class="progress">${items.map((_, i) => BANANA.replace('<svg ', `<svg class="${i < idx ? '' : i === idx ? 'now' : 'off'}" `)).join('')}</div>`;
    const card = `<div class="pic-card" id="card"><span class="emo">${emo}</span>
      <button class="say-btn" id="sayw" aria-label="Wort anhören">🔊</button></div>`;
    if (ex.type === 'ring') {
      body.innerHTML = `${prog}<div class="ring-wrap"><div class="ring" id="ring">${card}
          ${stuck.map((e, i) => { const a = -Math.PI / 2 + i * (Math.PI * 2 / 12), r = 37; return `<span class="stuck" style="left:${50 + r * Math.cos(a)}%;top:${50 + r * Math.sin(a)}%">${e}</span>`; }).join('')}
        </div></div>
        <div class="word ${wordCls}" id="word"></div>
        <div class="answers">
          <button class="ans yes" data-a="1"><span class="cap">✔ Ja, ich höre ${ex.target === 'l' ? 'L' : 'O'}</span></button>
          <button class="ans no" data-a="0"><span class="cap">✘ Nein</span></button></div>
        <div class="tray-label">${trayItems.length ? 'Ohne ' + (ex.target === 'l' ? 'L' : 'O') + ':' : ''}</div>
        <div class="tray">${trayItems.join(' ')}</div>`;
    } else {
      body.innerHTML = `${prog}${card}<div class="word ${wordCls}" id="word"></div>
        <div class="answers">${ex.options.map(([k, l]) => `<button class="ans ${ex.mode === 'letter' ? 'letter' : ''}" data-a="${k}"
          style="${ex.mode === 'letter' ? `color:var(${'Ll'.includes(k) ? '--l-ink' : '--o-ink'})` : ''}">${optHtml(k, l)}</button>`).join('')}</div>`;
    }
    body.querySelector('#sayw').onclick = () => say(word);
    body.querySelectorAll('[data-a]').forEach(b => b.onclick = () => answer(b));
    say(word, true);
  }
  function answer(btn) {
    if (locked) return;
    const [word, emo, sol] = items[idx];
    if (String(btn.dataset.a) === String(sol)) {
      locked = true; good(); btn.classList.add('right');
      body.querySelector('#word').innerHTML = highlight(word, ex, String(sol));
      say(word);
      if (ex.type === 'ring') { if (sol) stuck.push(emo); else trayItems.push(emo); }
      setTimeout(() => { idx++; locked = false; render(); }, 1100);
    } else {
      errs++; if (oops(ex, errs)) return;
      sBad(); shake(btn); shake(body.querySelector('#card'));
    }
  }
  render();
}

/* ================= Buchstaben finden ================= */
function runFind(ex, lv) {
  const body = board(lv, ex.instr, ex.say);
  const test = ex.target === 'l' ? isL : isO;
  say(ex.say);
  let errs = 0, found = 0, total = 0;
  setLives(0);
  if (ex.type === 'tiles') {
    const letters = ex.make();
    total = letters.filter(test).length;
    body.innerHTML = `<div class="counter" id="cnt"></div><div class="tiles">${letters.map(c => `<button class="tile" data-c="${c}">${c}</button>`).join('')}</div>`;
  } else {
    const lines = ex.make ? ex.make() : ex.lines;
    const chBtn = c => /[A-Za-zÄÖÜäöüß]/.test(c) ? `<button class="ch" data-c="${c}">${c}</button>` : `<span class="ch punct">${c}</span>`;
    body.innerHTML = `<div class="counter" id="cnt"></div><div class="find-text ${ex.poem ? 'poem' : ''}">${lines.map(l => {
      if (l.kind === 'letters') return `<div class="find-line letters">${l.text.split(' ').map(chBtn).join('')}</div>`;
      return `<div class="find-line">${l.text.split(' ').map(w => `<span class="find-word">${[...w].map(chBtn).join('')}</span>`).join('')}</div>`;
    }).join('')}</div>`;
    total = lines.reduce((n, l) => n + [...l.text].filter(test).length, 0);
  }
  const cnt = body.querySelector('#cnt');
  const upd = () => { cnt.textContent = `Gefunden: ${found} von ${total}`; };
  upd();
  body.onclick = e => {
    const b = e.target.closest('[data-c]'); if (!b || b.classList.contains('found')) return;
    if (test(b.dataset.c)) {
      b.classList.add('found'); found++; good(); upd();
      if (found === total) { sWin(); setTimeout(() => finish(ex, errs), 1100); }
    } else { errs++; if (oops(ex, errs)) return; sBad(); shake(b); }
  };
}

/* ================= Reimwörter ================= */
function runRhyme(ex, lv) {
  const body = board(lv, ex.instr, ex.say);
  const pairs = shuffle(ex.families.map(f => pick(f))).slice(0, 4);
  const top = pairs.map((p, i) => ({ w: p[0][0], e: p[0][1], k: i }));
  const bottom = shuffle(pairs.map((p, i) => ({ w: p[1][0], e: p[1][1], k: i })));
  const card = (x, side) => `<button class="rcard" data-side="${side}" data-k="${x.k}" aria-label="${x.w}"><span>${x.e}</span></button>`;
  body.innerHTML = `<div class="rhyme" id="rh"><svg id="lines"></svg>
    <div class="rhyme-row">${top.map(x => card(x, 't')).join('')}</div>
    <div class="rhyme-row">${bottom.map(x => card(x, 'b')).join('')}</div></div>`;
  say(ex.say);
  const rh = body.querySelector('#rh'), svg = body.querySelector('#lines');
  let sel = null, done = [], errs = 0;
  setLives(0);
  function drawLines() {
    const r0 = rh.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${r0.width} ${r0.height}`);
    svg.innerHTML = done.map(k => {
      const a = rh.querySelector(`[data-side="t"][data-k="${k}"]`).getBoundingClientRect();
      const b = rh.querySelector(`[data-side="b"][data-k="${k}"]`).getBoundingClientRect();
      const x1 = a.left + a.width / 2 - r0.left, y1 = a.bottom - r0.top, x2 = b.left + b.width / 2 - r0.left, y2 = b.top - r0.top, my = (y1 + y2) / 2;
      return `<path d="M${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}" fill="none" stroke="#4b8a28" stroke-width="6" stroke-linecap="round"/>
        <circle cx="${x1}" cy="${y1}" r="6" fill="#4b8a28"/><circle cx="${x2}" cy="${y2}" r="6" fill="#4b8a28"/>`;
    }).join('');
  }
  rh.onclick = e => {
    const b = e.target.closest('.rcard'); if (!b || b.classList.contains('done')) return;
    const k = +b.dataset.k, side = b.dataset.side;
    say((side === 't' ? top : bottom).find(y => y.k === k).w);
    if (!sel || sel.dataset.side === side) { if (sel) sel.classList.remove('sel'); sel = b; b.classList.add('sel'); return; }
    if (+sel.dataset.k === k) {
      sel.classList.remove('sel'); sel.classList.add('done'); b.classList.add('done');
      done.push(k); good(); drawLines(); sel = null;
      const p = pairs[k]; setTimeout(() => say(p[0][0] + ', ' + p[1][0]), 450);
      if (done.length === pairs.length) setTimeout(() => finish(ex, errs), 1800);
    } else {
      errs++; if (oops(ex, errs)) return;
      sBad(); shake(b); shake(sel); sel.classList.remove('sel'); sel = null;
    }
  };
  window.addEventListener('resize', drawLines);
  cleanup = () => window.removeEventListener('resize', drawLines);
}

/* ================= Bonus: Affen-Lauf (Wischen, Tippen, Pfeiltasten) ================= */
const monkeyImg = (() => { const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(monkey('happy')); return img; })();
function gameShell(ex, lv, extra) {
  const body = board(lv, ex.instr, ex.say);
  setLives(0);
  body.innerHTML = `<div class="game-hud" id="hud">${bananaRow(0, ex.goal, 'goal')}</div>
    <div class="game-wrap"><canvas id="gc" aria-label="Spielfeld"></canvas>
      <div class="overlay" id="ov"><button class="btn primary big" id="gostart">▶ Los geht's!</button><p>${extra}</p></div></div>`;
  say(ex.say);
  return body;
}
function runRun(ex, lv) {
  const body = gameShell(ex, lv, 'Wischen, aufs Feld tippen oder Pfeiltasten');
  body.insertAdjacentHTML('beforeend', `<div class="dpad" aria-label="Steuerung">
    <button data-d="up" aria-label="hoch">▲</button><button data-d="left" aria-label="links">◀</button>
    <button data-d="down" aria-label="runter">▼</button><button data-d="right" aria-label="rechts">▶</button></div>`);
  const cv = body.querySelector('#gc'), g = cv.getContext('2d');
  const COLS = 7, ROWS = 8, STEP = 300;
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const hero = { x: 3, y: 4, px: 3, py: 4, t: 0 };
  let cell = 40, W = 0, H = 0, dir = null, want = null, items = [], got = 0, errs = 0;
  let running = false, over = false, raf = 0, last = 0, acc = 0, flash = -1e9;
  function size() {
    const r = cv.parentElement.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cell = Math.floor(Math.min(r.width / COLS, (window.innerHeight * 0.52) / ROWS));
    W = cell * COLS; H = cell * ROWS;
    cv.style.width = W + 'px'; cv.style.height = H + 'px'; cv.width = W * dpr; cv.height = H * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0); draw(performance.now());
  }
  const isFree = (x, y) => !items.some(it => it.x === x && it.y === y) && Math.abs(x - hero.x) + Math.abs(y - hero.y) > 1;
  function spawn(now, wantIt) {
    for (let t = 0; t < 60; t++) {
      const x = rand(COLS), y = rand(ROWS); if (!isFree(x, y)) continue;
      items.push({ x, y, c: pick(wantIt ? ex.want : ex.other), want: wantIt, born: now, life: 7000 + Math.random() * 3500 }); return;
    }
  }
  function fill(now) {
    items = items.filter(it => now - it.born < it.life);
    while (items.length < 6) spawn(now, items.filter(i => i.want).length < 2 || Math.random() < 0.5);
  }
  function setDir(d) { if (!running) return; want = d; if (!dir) acc = STEP; }
  function update(now, dt) {
    acc += dt;
    if (acc < STEP) return;
    acc = 0;
    if (want) dir = want;
    hero.px = hero.x; hero.py = hero.y; hero.t = now;
    if (dir) { const [dx, dy] = DIRS[dir], nx = hero.x + dx, ny = hero.y + dy; if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) { hero.x = nx; hero.y = ny; } }
    const hit = items.find(it => it.x === hero.x && it.y === hero.y);
    if (hit) {
      items.splice(items.indexOf(hit), 1);
      if (hit.want) {
        got++; good(); say((hit.c === hit.c.toUpperCase() ? 'großes ' : 'kleines ') + hit.c);
        body.querySelector('#hud').innerHTML = bananaRow(got, ex.goal, 'goal');
        if (got >= ex.goal) { over = true; running = false; setTimeout(() => { stop(); finish(ex, errs); }, 500); return; }
      } else {
        errs++; flash = now; say('Das ist ein ' + hit.c);
        if (oops(ex, errs)) return;
        sBad();
      }
    }
    fill(now);
  }
  function draw(now) {
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { g.fillStyle = (x + y) % 2 ? '#7cc35b' : '#88cc66'; g.fillRect(x * cell, y * cell, cell, cell); }
    g.textAlign = 'center'; g.textBaseline = 'middle';
    items.forEach(it => {
      const leftT = it.life - (now - it.born);
      if (leftT < 1500 && Math.floor(now / 160) % 2) return;   // blinkt, bevor er verschwindet
      const cx = it.x * cell + cell / 2, cy = it.y * cell + cell / 2;
      g.fillStyle = '#fff8e6'; g.strokeStyle = '#8a5a2b'; g.lineWidth = 3;
      g.beginPath(); g.arc(cx, cy, cell * 0.4, 0, Math.PI * 2); g.fill(); g.stroke();
      g.fillStyle = '#2b2113'; g.font = `700 ${Math.round(cell * 0.56)}px SchulDruck, sans-serif`; g.fillText(it.c, cx, cy + cell * 0.03);
    });
    const f = Math.min(1, (now - hero.t) / STEP), hx = hero.px + (hero.x - hero.px) * f, hy = hero.py + (hero.y - hero.py) * f;
    const hop = running && dir ? Math.sin(f * Math.PI) * cell * 0.12 : 0, s = cell * 1.15;
    if (monkeyImg.complete) g.drawImage(monkeyImg, hx * cell + cell / 2 - s / 2, hy * cell + cell / 2 - s * 0.62 - hop, s, s * 136 / 110);
    if (now - flash < 350) { g.fillStyle = 'rgba(216,53,42,.28)'; g.fillRect(0, 0, W, H); }
  }
  function loop(now) {
    const dt = Math.min(120, now - last); last = now;
    if (running) update(now, dt);
    draw(now);
    if (!over || now - flash < 400) raf = requestAnimationFrame(loop);
  }
  // Steuerung
  const keys = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
  const onKey = e => { const d = keys[e.key]; if (!d) return; e.preventDefault(); setDir(d); };
  window.addEventListener('keydown', onKey);
  let sw = null;
  cv.onpointerdown = e => { sw = { x: e.clientX, y: e.clientY, moved: false }; try { cv.setPointerCapture(e.pointerId); } catch (er) {} };
  cv.onpointermove = e => {
    if (!sw) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (Math.hypot(dx, dy) < 22) return;
    setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    sw = { x: e.clientX, y: e.clientY, moved: true };
  };
  cv.onpointerup = e => {
    if (sw && !sw.moved) {   // Tippen: in Richtung des angetippten Feldes laufen
      const r = cv.getBoundingClientRect(), tx = (e.clientX - r.left) / cell - 0.5, ty = (e.clientY - r.top) / cell - 0.5;
      const dx = tx - hero.x, dy = ty - hero.y;
      if (Math.abs(dx) > 0.4 || Math.abs(dy) > 0.4) setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    }
    sw = null;
  };
  body.querySelector('.dpad').onpointerdown = e => { const b = e.target.closest('[data-d]'); if (b) { e.preventDefault(); setDir(b.dataset.d); } };
  body.querySelector('#gostart').onclick = () => {
    body.querySelector('#ov').hidden = true; running = true; last = performance.now(); fill(last); say('Los!');
  };
  function stop() { over = true; running = false; cancelAnimationFrame(raf); window.removeEventListener('keydown', onKey); window.removeEventListener('resize', size); }
  cleanup = stop;
  window.addEventListener('resize', size);
  monkeyImg.onload = () => draw(performance.now());
  size(); last = performance.now(); raf = requestAnimationFrame(loop);
}

/* ================= Bonus: Kokos-Ninja (Wischen zum Zerschneiden) ================= */
function runNinja(ex, lv) {
  const body = gameShell(ex, lv, 'Wisch mit dem Finger über die richtigen Kokosnüsse');
  const cv = body.querySelector('#gc'), g = cv.getContext('2d');
  let W = 0, H = 0, R = 36, GRAV = 900, nuts = [], halves = [], bits = [], trail = [];
  let running = false, over = false, raf = 0, last = 0, nextSpawn = 0, got = 0, errs = 0, flash = -1e9, down = false, prev = null;
  function size() {
    const r = cv.parentElement.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    W = Math.floor(r.width); H = Math.floor(Math.min(W * 1.1, window.innerHeight * 0.56));
    R = Math.max(28, Math.min(46, W * 0.085)); GRAV = H * 1.6;
    cv.style.width = W + 'px'; cv.style.height = H + 'px'; cv.width = W * dpr; cv.height = H * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0); draw(performance.now());
  }
  function launch() {
    const x = R + Math.random() * (W - 2 * R), peak = H * (0.5 + Math.random() * 0.32);
    const wantIt = Math.random() < 0.5;
    nuts.push({ x, y: H + R, vx: (W / 2 - x) * 0.45 + (Math.random() - 0.5) * 60, vy: -Math.sqrt(2 * GRAV * peak),
      c: pick(wantIt ? ex.want : ex.other), want: wantIt, rot: 0, vr: (Math.random() - 0.5) * 1.5 });
  }
  function slice(n, now) {
    if (!running || n.dead) return;
    n.dead = true;
    [-1, 1].forEach(s => halves.push({ x: n.x, y: n.y, vx: n.vx + s * 90, vy: n.vy - 120, rot: n.rot, vr: s * 4, side: s, c: n.c }));
    for (let k = 0; k < 12; k++) { const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 160; bits.push({ x: n.x, y: n.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.6 }); }
    if (n.want) {
      got++; good(); body.querySelector('#hud').innerHTML = bananaRow(got, ex.goal, 'goal');
      if (got >= ex.goal) { over = true; running = false; setTimeout(() => { stop(); finish(ex, errs); }, 700); }
    } else {
      errs++; flash = now; say('Das war ein ' + n.c);
      if (oops(ex, errs)) return;
      sBad();
    }
  }
  const segDist = (p, a, b) => { const dx = b.x - a.x, dy = b.y - a.y, l = dx * dx + dy * dy || 1;
    const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / l)); return Math.hypot(p.x - a.x - t * dx, p.y - a.y - t * dy); };
  function cut(a, b, now) { if (!running) return; nuts.forEach(n => { if (!n.dead && segDist(n, a, b) < R) slice(n, now); }); }
  function update(now, dt) {
    const s = dt / 1000;
    if (running && now > nextSpawn) { launch(); if (Math.random() < 0.3) launch(); nextSpawn = now + 1000 + Math.random() * 500; }
    [nuts, halves, bits].forEach(list => list.forEach(o => { o.vy += GRAV * s; o.x += o.vx * s; o.y += o.vy * s; if (o.vr) o.rot += o.vr * s; if (o.life) o.life -= s; }));
    nuts = nuts.filter(n => !n.dead && !(n.vy > 0 && n.y > H + R * 2));
    halves = halves.filter(h => h.y < H + R * 2);
    bits = bits.filter(b => b.life > 0);
    trail = trail.filter(p => now - p.t < 180);
  }
  function nutPath(side) {
    g.beginPath();
    if (side) g.arc(0, 0, R, side < 0 ? Math.PI / 2 : -Math.PI / 2, side < 0 ? Math.PI * 1.5 : Math.PI / 2);
    else g.arc(0, 0, R, 0, Math.PI * 2);
    g.closePath();
  }
  function drawNut(o, side) {
    g.save(); g.translate(o.x, o.y); g.rotate(o.rot);
    nutPath(side); g.fillStyle = '#7a4a24'; g.fill();
    g.save(); nutPath(side); g.clip();
    g.beginPath(); g.arc(0, 0, R * 0.74, 0, Math.PI * 2); g.fillStyle = side ? '#fffaf0' : '#f6ead2'; g.fill();
    g.restore();
    if (!side) { g.rotate(-o.rot); g.fillStyle = '#2b2113'; g.font = `700 ${Math.round(R * 1.05)}px SchulDruck, sans-serif`;
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(o.c, 0, R * 0.04); }
    g.restore();
  }
  function draw(now) {
    const grd = g.createLinearGradient(0, 0, 0, H); grd.addColorStop(0, '#d9f2c9'); grd.addColorStop(1, '#8fcf6f');
    g.fillStyle = grd; g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(47,108,51,.25)'; for (let k = 0; k < 5; k++) { g.beginPath(); g.ellipse(W * (k / 4), H, W * 0.18, H * 0.08, 0, 0, Math.PI * 2); g.fill(); }
    halves.forEach(h => drawNut(h, h.side));
    nuts.forEach(n => drawNut(n, 0));
    g.fillStyle = '#fffaf0'; bits.forEach(b => { g.beginPath(); g.arc(b.x, b.y, 3.5, 0, Math.PI * 2); g.fill(); });
    if (trail.length > 1) { g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = 8;
      g.beginPath(); g.moveTo(trail[0].x, trail[0].y); trail.forEach(p => g.lineTo(p.x, p.y)); g.stroke(); }
    if (now - flash < 350) { g.fillStyle = 'rgba(216,53,42,.25)'; g.fillRect(0, 0, W, H); }
  }
  function loop(now) {
    const dt = Math.min(50, now - last); last = now;
    update(now, dt); draw(now);
    if (!over || halves.length || bits.length) raf = requestAnimationFrame(loop);
  }
  const at = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, t: performance.now() }; };
  cv.onpointerdown = e => { down = true; prev = at(e); trail = [prev]; try { cv.setPointerCapture(e.pointerId); } catch (er) {}
    nuts.forEach(n => { if (running && !n.dead && Math.hypot(n.x - prev.x, n.y - prev.y) < R) slice(n, prev.t); }); };
  cv.onpointermove = e => { if (!down) return; const p = at(e); trail.push(p); cut(prev, p, p.t); prev = p; };
  cv.onpointerup = cv.onpointercancel = () => { down = false; prev = null; };
  body.querySelector('#gostart').onclick = () => { body.querySelector('#ov').hidden = true; running = true; nextSpawn = performance.now() + 300; say('Los!'); };
  function stop() { over = true; running = false; cancelAnimationFrame(raf); window.removeEventListener('resize', size); }
  cleanup = stop;
  window.addEventListener('resize', size);
  size(); last = performance.now(); raf = requestAnimationFrame(loop);
}

/* ================= Ergebnis ================= */
function tooMany(ex) {

  const body = app.querySelector('.task-body');
  body.onclick = null;
  body.innerHTML = `<div class="result"><div class="big-monkey">${monkey('sad')}</div>
    <h2>Uh-oh! Zu viele Fehler</h2><p>Mehr als ${MAX_ERRS} Fehler. Hör genau hin und spiel das Level noch einmal.</p>
    <div class="btn-row"><button class="btn primary" id="again">↻ Level wiederholen</button><button class="btn" id="ov2">🗺️ Karte</button></div></div>`;
  sBad(); say('Uh-oh! Das waren zu viele Fehler. Spiel das Level noch einmal.');
  body.querySelector('#again').onclick = () => go('level', levelOfEx(ex.id));
  body.querySelector('#ov2').onclick = () => go('map');
}
function finish(ex, errs) {
  const lv = levelOfEx(ex.id);
  const got = errs === 0 ? 3 : errs === 1 ? 2 : 1;
  state.stars[ex.id] = state.passed[ex.id] ? Math.max(state.stars[ex.id] || 0, got) : got;
  state.passed[ex.id] = true; save();
  const body = app.querySelector('.task-body');
  const praise = got === 3 ? 'Affenstark!' : got === 2 ? 'Super gemacht!' : 'Geschafft!';
  const nx = nextStep(lv);
  body.innerHTML = `<div class="result"><div class="big-monkey">${monkey('cheer')}</div>
    <h2>${praise}</h2>${bananaRow(got, 3)}
    <p>${errs === 0 ? 'Ohne Fehler – 3 Bananen!' : `${errs} Fehler – ${got} ${got === 1 ? 'Banane' : 'Bananen'}`}</p>
    <div class="btn-row"><button class="btn" id="again">↻ Nochmal</button><button class="btn" id="ov2">🗺️ Karte</button>
      <button class="btn primary" id="next">${nx.label}</button></div></div>`;
  document.getElementById('bc').textContent = totalBananas();
  sWin(); say(praise); bananaRain(got * 5);
  body.querySelector('#again').onclick = () => go('level', lv);
  body.querySelector('#ov2').onclick = () => go('map');
  body.querySelector('#next').onclick = nx.fn;
}

/* ================= Start ================= */
(async () => {
  if (Cloud.on) {
    app.innerHTML = `<div class="loading">${monkey('wow')}<p>Der Dschungel lädt …</p></div>`;
    await refreshKids();
  }
  go('who');
})();
})();
</script>
</body>
