<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League of Champions – Turniere</title>
<meta name="description" content="Turnierübersicht, Infos, Team-Anmeldung und Rangliste für die Footvolley League of Champions Tour.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============ THEME TOKENS ============ */
  :root {
    --bg: #f7f6f2;
    --surface: #ffffff;
    --heading: #1c214b;
    --text: #1c214b;
    --text-muted: #6b7080;
    --border: #e2e1da;
    --ink-deep: #12153a;
    --on-ink: #f5f3ec;
    --gold: #e4a730;
    --gold-soft: #f0c775;
    --paid: #2f9e6e;
    --pending-text: #a97a1a;
    --pill-bg: #1c214b;
    --pill-text: #f7f6f2;
    --nav-bg: rgba(247,246,242,0.92);
    --shadow: rgba(28,33,75,0.10);
    --tint-ink: rgba(28,33,75,0.07);
    --tint-paid: rgba(47,158,110,0.14);
    --tint-pending: rgba(228,167,48,0.16);
    --tint-muted: rgba(107,112,128,0.12);
    --radius: 3px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10132c;
      --surface: #1a1e42;
      --heading: #f5f3ec;
      --text: #ece9e0;
      --text-muted: #9a9fc0;
      --border: #2c3268;
      --ink-deep: #090b1e;
      --pill-bg: #e4a730;
      --pill-text: #12153a;
      --nav-bg: rgba(16,19,44,0.88);
      --shadow: rgba(0,0,0,0.45);
      --tint-ink: rgba(255,255,255,0.07);
      --tint-paid: rgba(47,158,110,0.22);
      --tint-pending: rgba(228,167,48,0.22);
      --tint-muted: rgba(255,255,255,0.09);
      --pending-text: #f0c775;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10132c;
    --surface: #1a1e42;
    --heading: #f5f3ec;
    --text: #ece9e0;
    --text-muted: #9a9fc0;
    --border: #2c3268;
    --ink-deep: #090b1e;
    --pill-bg: #e4a730;
    --pill-text: #12153a;
    --nav-bg: rgba(16,19,44,0.88);
    --shadow: rgba(0,0,0,0.45);
    --tint-ink: rgba(255,255,255,0.07);
    --tint-paid: rgba(47,158,110,0.22);
    --tint-pending: rgba(228,167,48,0.22);
    --tint-muted: rgba(255,255,255,0.09);
    --pending-text: #f0c775;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:var(--text); background:var(--bg); line-height:1.6; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Space Grotesk',sans-serif; font-weight:600; line-height:1.15; color:var(--heading); text-wrap:balance; }
  .mono { font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  a { color:inherit; }
  button { font-family:inherit; cursor:pointer; }
  :focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  .container { max-width:1080px; margin:0 auto; padding:0 28px; }
  [hidden] { display:none !important; }

  /* ============ NAV ============ */
  .nav { position:sticky; top:0; z-index:50; background:var(--nav-bg); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
  .nav-inner { max-width:1080px; margin:0 auto; padding:16px 28px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .wordmark { display:flex; align-items:baseline; gap:8px; background:none; border:none; padding:0; }
  .wordmark .mark { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; letter-spacing:0.5px; color:var(--heading); }
  .wordmark .sub { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--gold); font-weight:600; }
  .nav-right { display:flex; align-items:center; gap:22px; }
  .nav-links { display:flex; align-items:center; gap:20px; }
  .nav-link { background:none; border:none; font-size:13px; font-weight:600; color:var(--text-muted); padding:4px 0; border-bottom:2px solid transparent; }
  .nav-link:hover { color:var(--heading); }
  .nav-link.active { color:var(--heading); border-bottom-color:var(--gold); }
  .ig-link { display:flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%; border:1px solid var(--border); color:var(--text-muted); transition:border-color .15s, color .15s; }
  .ig-link:hover { border-color:var(--gold); color:var(--heading); }
  .season-tag { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-muted); letter-spacing:0.5px; }

  /* ============ BUTTONS ============ */
  .btn { display:inline-block; padding:14px 28px; border-radius:var(--radius); font-size:13px; font-weight:600; letter-spacing:0.4px; border:none; transition:transform .15s, background .15s, opacity .15s; }
  .btn-gold { background:var(--gold); color:#12153a; }
  .btn-gold:hover { background:var(--gold-soft); transform:translateY(-1px); }
  .btn-gold:disabled { opacity:0.6; transform:none; cursor:default; }
  .btn-outline { background:transparent; color:var(--heading); border:1px solid var(--border); }
  .btn-outline:hover { border-color:var(--heading); }
  .btn-block { width:100%; text-align:center; }
  .btn-ghost { background:none; border:none; color:var(--text-muted); font-size:13px; font-weight:600; text-decoration:underline; text-underline-offset:3px; }
  .btn-ghost:hover { color:var(--heading); }
  .back-btn { background:none; border:none; color:var(--text-muted); font-size:13px; font-weight:600; padding:24px 0 4px; }
  .back-btn:hover { color:var(--heading); }

  main { min-height:60vh; }

  .demo-banner { background:var(--tint-pending); color:var(--pending-text); font-size:12.5px; font-weight:600; text-align:center; padding:9px 16px; }

  /* ============ HOME ============ */
  .home-hero { padding:56px 0 36px; }
  .home-hero h1 { font-size:clamp(30px,4.5vw,44px); max-width:680px; margin-bottom:14px; }
  .home-hero p { color:var(--text-muted); font-size:16px; max-width:560px; }
  .tabs { display:flex; gap:8px; padding:8px 0 28px; flex-wrap:wrap; }
  .tab { background:var(--surface); border:1px solid var(--border); padding:10px 18px; border-radius:20px; font-size:13px; font-weight:600; color:var(--text-muted); }
  .tab.active { background:var(--pill-bg); color:var(--pill-text); border-color:var(--pill-bg); }
  .tournament-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; padding-bottom:80px; }
  .tcard { text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px; display:flex; flex-direction:column; gap:10px; transition:transform .15s, box-shadow .15s; }
  .tcard:hover { transform:translateY(-3px); box-shadow:0 10px 28px var(--shadow); }
  .tcard-top { display:flex; justify-content:space-between; align-items:center; }
  .tier { font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; color:var(--heading); background:var(--tint-ink); padding:4px 9px; border-radius:12px; }
  .badge { font-size:10.5px; font-weight:600; letter-spacing:0.4px; padding:4px 9px; border-radius:12px; text-transform:uppercase; }
  .badge-upcoming { background:var(--tint-paid); color:var(--paid); }
  .badge-past { background:var(--tint-muted); color:var(--text-muted); }
  .tcard h3 { font-size:19px; }
  .tcard-meta { display:flex; flex-direction:column; gap:3px; font-size:12.5px; color:var(--text-muted); }
  .tcard-cat { font-size:12.5px; color:var(--text-muted); }
  .tcard-count { font-size:11.5px; color:var(--gold); font-weight:600; margin-top:2px; }

  /* ============ EVENT IMAGE ============ */
  .event-image { width:100%; aspect-ratio:16/7; border-radius:var(--radius); overflow:hidden; margin-bottom:24px; background:linear-gradient(135deg,var(--ink-deep),var(--heading)); display:flex; align-items:center; justify-content:center; position:relative; }
  .event-image img { width:100%; height:100%; object-fit:cover; display:block; }
  .event-image .ph-tier { font-family:'Space Grotesk',sans-serif; font-weight:700; color:rgba(245,243,236,0.18); font-size:clamp(40px,9vw,90px); letter-spacing:2px; }
  .event-image .ph-tag { position:absolute; bottom:14px; left:16px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:rgba(245,243,236,0.55); }

  /* ============ DETAIL ============ */
  .detail-head { padding-top:6px; margin-bottom:28px; }
  .detail-head h1 { font-size:clamp(28px,4vw,40px); margin:10px 0 8px; }
  .detail-meta { color:var(--text-muted); font-size:14px; }
  .detail-info-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:28px; }
  .info-block { background:var(--surface); padding:18px 20px; display:flex; flex-direction:column; gap:6px; }
  .info-block .label { font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); }
  .info-block .value { font-weight:600; color:var(--heading); font-size:15px; }
  .closed-note { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; color:var(--text-muted); font-size:14px; margin-bottom:28px; }
  .resume-banner { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px; background:var(--tint-pending); border:1px solid var(--gold); border-radius:var(--radius); padding:16px 20px; margin-bottom:28px; }
  .resume-banner p { font-size:13.5px; color:var(--pending-text); font-weight:600; }
  .comp-actions { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .section-title { font-size:20px; margin:44px 0 14px; }
  .section-title:first-of-type { margin-top:0; }
  .player-list { display:flex; flex-direction:column; gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:20px; }
  .player-row { background:var(--surface); padding:14px 18px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .player-club { display:block; font-size:12.5px; color:var(--text-muted); margin-top:2px; }
  .status { font-size:11px; font-weight:600; padding:4px 10px; border-radius:12px; white-space:nowrap; }
  .status-bezahlt { background:var(--tint-paid); color:var(--paid); }
  .status-pending { background:var(--tint-pending); color:var(--pending-text); }
  .empty-note { color:var(--text-muted); font-size:14px; padding:4px 0 40px; }

  /* ============ COMPETITION SELECT ============ */
  .comp-select-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; max-width:640px; padding-bottom:60px; }
  .comp-card { text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:28px; display:flex; flex-direction:column; gap:8px; transition:transform .15s, box-shadow .15s, border-color .15s; }
  .comp-card:hover { transform:translateY(-3px); box-shadow:0 10px 28px var(--shadow); border-color:var(--gold); }
  .comp-card h3 { font-size:20px; }
  .comp-card span { color:var(--text-muted); font-size:13px; }

  /* ============ REGISTER ============ */
  .register-inner { max-width:560px; margin:0 auto; padding-bottom:80px; }
  .register-head { padding:6px 0 28px; }
  .eyebrow { display:block; color:var(--gold); font-weight:600; letter-spacing:0.5px; margin-bottom:10px; font-size:12px; text-transform:uppercase; }
  .register-head h1 { font-size:30px; }
  form { border:1px solid var(--border); background:var(--surface); border-radius:var(--radius); padding:32px; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .form-group { display:flex; flex-direction:column; gap:6px; margin-bottom:18px; position:relative; }
  .form-row .form-group { margin-bottom:0; }
  label { font-size:12px; font-weight:600; }
  input, select { font-family:'Inter',sans-serif; font-size:15px; padding:12px 13px; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg); color:var(--text); width:100%; transition:border-color .15s; }
  input:focus, select:focus { outline:none; border-color:var(--gold); }
  .combo-group { margin-bottom:18px; }
  .combo-dropdown { position:absolute; top:100%; left:0; right:0; margin-top:4px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:0 12px 24px var(--shadow); max-height:260px; overflow-y:auto; z-index:10; }
  .combo-item { display:flex; align-items:center; gap:10px; padding:9px 12px; font-size:14px; cursor:pointer; }
  .combo-item:hover { background:var(--bg); }
  .club-avatar { width:26px; height:26px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; color:#fff; overflow:hidden; }
  .club-avatar img { width:100%; height:100%; object-fit:cover; }
  .checkbox-row { display:flex; gap:9px; align-items:flex-start; margin-bottom:24px; cursor:pointer; }
  .checkbox-row input { width:16px; height:16px; margin-top:3px; flex-shrink:0; accent-color:var(--gold); }
  .checkbox-row span { font-size:12.5px; color:var(--text-muted); }
  .form-error { color:#b3401f; font-size:13px; text-align:center; margin-top:12px; min-height:16px; }

  .pay-summary { border:1px solid var(--border); background:var(--surface); border-radius:var(--radius); padding:26px 28px; margin-bottom:16px; }
  .pay-summary div { display:flex; justify-content:space-between; padding:8px 0; font-size:14px; border-bottom:1px solid var(--border); }
  .pay-summary div:last-child { border-bottom:none; }
  .pay-summary span { color:var(--text-muted); }
  #paymentStep .btn { margin-bottom:10px; }
  .pay-note { text-align:center; font-size:12px; color:var(--text-muted); margin-top:10px; }

  .confirmation { text-align:center; padding:50px 20px; }
  .confirm-icon { width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto 18px; }
  .confirm-paid { background:var(--tint-paid); color:var(--paid); }
  .confirm-pending { background:var(--tint-pending); color:var(--pending-text); }
  .confirmation h2 { font-size:24px; margin-bottom:10px; }
  .confirmation p { color:var(--text-muted); font-size:15px; max-width:380px; margin:0 auto; }
  .confirmation .btn { margin-top:22px; }

  /* ============ RANKING ============ */
  .ranking-head { padding:44px 0 24px; }
  .ranking-head h1 { font-size:clamp(26px,4vw,36px); margin-bottom:8px; }
  .ranking-head p { color:var(--text-muted); font-size:15px; }
  .demo-tag { display:inline-block; margin-top:10px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--pending-text); background:var(--tint-pending); padding:4px 10px; border-radius:12px; }
  .ranking-groups { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:24px; padding-bottom:80px; }
  .ranking-table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); }
  .ranking-table-wrap h3 { padding:16px 18px; border-bottom:1px solid var(--border); font-size:16px; }
  table.ranking { width:100%; border-collapse:collapse; font-size:13.5px; }
  table.ranking th { text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.6px; text-transform:uppercase; color:var(--text-muted); padding:10px 14px; border-bottom:1px solid var(--border); }
  table.ranking td { padding:11px 14px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; }
  table.ranking tr:last-child td { border-bottom:none; }
  table.ranking td.rank { color:var(--text-muted); width:32px; }
  table.ranking td.pts { text-align:right; font-weight:600; color:var(--heading); }

  /* ============ IMPRESSUM ============ */
  .prose { max-width:640px; padding:44px 0 90px; }
  .prose h1 { font-size:clamp(26px,4vw,34px); margin-bottom:24px; }
  .prose h2 { font-size:16px; margin:28px 0 8px; }
  .prose p, .prose li { font-size:14.5px; color:var(--text-muted); }
  .prose ul { padding-left:20px; margin-top:4px; }
  .prose a { color:var(--heading); text-decoration:underline; text-underline-offset:3px; }
  .placeholder-field { color:var(--gold); }

  footer { background:var(--ink-deep); padding:44px 28px; text-align:center; margin-top:40px; }
  footer .mark { color:var(--on-ink); font-family:'Space Grotesk',sans-serif; font-weight:700; }
  footer .sub { color:var(--gold); font-family:'IBM Plex Mono',monospace; font-size:11px; }
  footer p { color:rgba(245,243,236,0.55); font-size:13px; margin-top:12px; }
  footer a { color:var(--gold-soft); }
  footer .foot-links { margin-top:18px; display:flex; gap:18px; justify-content:center; flex-wrap:wrap; }
  footer .foot-links button, footer .foot-links a { background:none; border:none; color:rgba(245,243,236,0.65); font-size:12.5px; font-weight:600; }
  footer .foot-links button:hover, footer .foot-links a:hover { color:var(--gold-soft); }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } * { transition:none !important; } }
  @media (max-width:640px) {
    .form-row { grid-template-columns:1fr; gap:0; }
    form { padding:22px; }
    .tabs { flex-wrap:wrap; }
    .nav-inner { padding:14px 20px; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <button class="wordmark" id="homeLink"><span class="mark">LEAGUE OF CHAMPIONS</span><span class="sub mono">FOOTVOLLEY</span></button>
    <div class="nav-right">
      <div class="nav-links">
        <button class="nav-link" data-route="home">Turniere</button>
        <button class="nav-link" data-route="ranking">Rangliste</button>
        <button class="nav-link" data-route="impressum">Impressum</button>
      </div>
      <a class="ig-link" id="igLink" href="#" target="_blank" rel="noopener" aria-label="Instagram">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor" stroke="none"/></svg>
      </a>
      <span class="season-tag" id="seasonTag"></span>
    </div>
  </div>
</nav>

<main>
  <div id="demoBanner" class="demo-banner" hidden>DEMO-MODUS – Anmeldungen werden nur lokal in diesem Browser gespeichert (kein echtes Backend verbunden)</div>

  <section id="view-home" class="view">
    <div class="container">
      <div class="home-hero">
        <h1>Europas größte Footvolley-Tour</h1>
        <p id="heroSub"></p>
      </div>
      <div class="tabs">
        <button class="tab active" data-filter="upcoming">Kommende Turniere</button>
        <button class="tab" data-filter="past">Vergangene Turniere</button>
      </div>
      <div id="tournamentGrid" class="tournament-grid"></div>
    </div>
  </section>

  <section id="view-detail" class="view" hidden>
    <div class="container">
      <button class="back-btn" data-back="home">← Alle Turniere</button>

  <section id="view-compselect" class="view" hidden>
    <div class="container">
      <button class="back-btn" data-back="detail">← Zurück zum Turnier</button>
      <div id="compSelectContent"></div>
    </div>
  </section>

  <section id="view-register" class="view" hidden>
    <div class="container">
      <button class="back-btn" data-back="detail">← Zurück zum Turnier</button>

    </div>
  </section>

  <section id="view-ranking" class="view" hidden>
    <div class="container">
      <div id="rankingContent"></div>
    </div>
  </section>

  <section id="view-impressum" class="view" hidden>
    <div class="container">
      <div class="prose" id="impressumContent"></div>

</main>

<footer>
  <span class="mark">LEAGUE OF CHAMPIONS</span> <span class="sub mono">FOOTVOLLEY</span>
  <p>Fragen? <a href="mailto:office@bolao-sports.com">office@bolao-sports.com</a> · <a href="tel:+436606577498">+43 660 6577498</a></p>
  <div class="foot-links">
    <button data-route="impressum">Impressum</button>
    <a href="#" id="igFootLink" target="_blank" rel="noopener">Instagram</a>
  </div>
</footer>

<script>
(function() {
  /* ==================================================================
     CONFIG – vor dem Go-Live hier eintragen
     ================================================================== */
  var CONFIG = {
    // Web-App-URL aus dem Google-Apps-Script-Deployment (siehe Setup-Guide).
    // Solange hier "PASTE_" drinsteht, läuft die Seite im Demo-Modus
    // (Anmeldungen werden nur lokal im Browser gespeichert).
    API_URL: 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE',
    INSTAGRAM_URL: 'https://instagram.com/PLATZHALTER_INSTAGRAM_HANDLE'
  };
  var DEMO_MODE = !CONFIG.API_URL || CONFIG.API_URL.indexOf('PASTE_') !== -1;

  /* ==================================================================
     DATEN – Turniere & Vereine. Bilder/Logos können einfach durch
     Bild-URLs ersetzt werden (image / logo Felder, aktuell null).

  function apiGet(action, params) {
    var qs = Object.keys(params || {}).map(function(k){ return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
    return fetch(CONFIG.API_URL + '?action=' + action + (qs ? '&' + qs : '')).then(function(r){ return r.json(); });
  }
  function apiPost(action, body) {
    var payload = Object.assign({ action: action }, body);
    return fetch(CONFIG.API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) }).then(function(r){ return r.json(); });
  }

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var currentFilter = 'upcoming';

  function setView(view) {
    ['home','detail','compselect','register','ranking','impressum'].forEach(function(v) {
      document.getElementById('view-' + v).hidden = v !== view;
    });
    document.querySelectorAll('.nav-link').forEach(function(l) {
      l.classList.toggle('active', l.dataset.route === (view === 'home' ? 'home' : view === 'ranking' ? 'ranking' : view === 'impressum' ? 'impressum' : ''));
    });
    window.scrollTo({ top:0, behavior: reduceMotion ? 'auto' : 'smooth' });
  }

  function parseHash() {
    var raw = location.hash.replace(/^#\/?/, '');
    var qIndex = raw.indexOf('?');
    var path = qIndex === -1 ? raw : raw.slice(0, qIndex);
    var query = {};
    if (qIndex !== -1) {
      raw.slice(qIndex + 1).split('&').forEach(function(pair) {
        if (!pair) return;
        var kv = pair.split('=');
        query[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
      });
    }
    return { parts: path.split('/').filter(Boolean), query: query };
  }

  function navigate(path) { location.hash = '#/' + path; }

  function route() {
    var h = parseHash();
    var p = h.parts;
    if (p[0] === 'event' && p[1]) {
      var t = tourById(p[1]);
      if (!t) { navigate(''); return; }
      if (p[2] === 'register') {
        var comp = decodeURIComponent(p[3] || t.competitions[0]);
        showRegister(t, comp, h.query);
      } else if (p[2] === 'compselect') {
        showCompSelect(t);
      } else {
        showDetail(t);
      }
    } else if (p[0] === 'ranking') {
      showRanking();
    } else if (p[0] === 'impressum') {
      showImpressum();
    } else {
      renderGrid(currentFilter);
      setView('home');
    }
  }

        '<div class="tcard-meta mono"><span>' + t.dateLabel + '</span><span>' + t.flag + ' ' + esc(t.city) + ', ' + esc(t.country) + '</span></div>' +
        '<div class="tcard-cat">' + esc(t.competitions.join(' & ')) + '</div>' +
        countSpan +

  function renderGrid(filter) {
    var list = TOURNAMENTS.filter(function(t){ return t.status === filter; })
      .sort(function(a,b){ return a.dateSort.localeCompare(b.dateSort); });
    grid.innerHTML = list.map(renderCard).join('');
    if (filter === 'upcoming') loadCounts();
  }

  function loadCounts() {
    var upcoming = TOURNAMENTS.filter(function(t){ return t.status === 'upcoming'; });
    upcoming.forEach(function(t) {
      backendListRegistrations(t.id).then(function(list) {
        var el = document.querySelector('[data-count-for="' + t.id + '"]');
        if (el && list.length > 0) el.textContent = list.length + (list.length === 1 ? ' Team angemeldet' : ' Teams angemeldet');
      });
    });
  }

  function checkResumablePayment(t) {
    var pendingId = localStorage.getItem('loc_pending_' + t.id);

    backendStatus(pendingId).then(function(res) {

        slot.innerHTML =
          '<div class="resume-banner">' +
            '<p>Du hast eine ausstehende Anmeldung – jetzt Startgebühr bezahlen, um deinen Platz zu sichern.</p>' +
            '<button class="btn btn-gold" id="resumePayBtn">Jetzt bezahlen</button>' +

          var comp = demoAll().find(function(r){ return r.id === pendingId; });

          navigate('event/' + t.id + '/register/' + encodeURIComponent(compName) + '?resume=' + pendingId);

  function setupClubCombo() {
    var search = document.getElementById('rVereinSearch');
    var hiddenInput = document.getElementById('rVerein');
    var dropdown = document.getElementById('vereinDropdown');
    search.addEventListener('input', function() {
      var q = search.value.trim().toLowerCase();
      hiddenInput.value = '';
      if (!q) { dropdown.hidden = true; return; }
      var matches = CLUBS.filter(function(c){ return c.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 8);
      if (!matches.length) { dropdown.hidden = true; return; }
      dropdown.innerHTML = matches.map(function(c){
        return '<div class="combo-item" data-club="' + esc(c.name) + '">' + clubAvatarHtml(c) + '<span>' + esc(c.name) + '</span></div>';
      }).join('');
      dropdown.hidden = false;
    });
    dropdown.addEventListener('click', function(e) {
      var item = e.target.closest('.combo-item');
      if (!item) return;
      search.value = item.dataset.club;
      hiddenInput.value = item.dataset.club;
      dropdown.hidden = true;
    });
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.combo-group')) dropdown.hidden = true;
    });
  }

      var err = document.getElementById('regError');
      err.textContent = '';
      var vorname = document.getElementById('rVorname').value.trim();
      var nachname = document.getElementById('rNachname').value.trim();
      var email = document.getElementById('rEmail').value.trim();
      var telefon = document.getElementById('rTelefon').value.trim();
      var partner = document.getElementById('rPartner').value.trim();
      var vereinHidden = document.getElementById('rVerein').value.trim();
      var vereinTyped = document.getElementById('rVereinSearch').value.trim();
      var verein = vereinHidden || vereinTyped;
      var consent = document.getElementById('rConsent').checked;

      if (!vorname || !nachname || !email || !telefon || !partner || !verein || !consent) {
        err.textContent = 'Bitte fülle alle Pflichtfelder aus.';
        return;
      }

      var submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Einen Moment …';

      var payload = { tournamentId:t.id, competition:competition, vorname:vorname, nachname:nachname, email:email, telefon:telefon, partner:partner, verein:verein };

      backendRegister(payload).then(function(res) {
        if (!res || !res.ok) throw new Error('save failed');
        localStorage.setItem('loc_pending_' + t.id, res.id);
        showPendingStep(Object.assign({ id:res.id }, payload));
      }).catch(function() {
        err.textContent = 'Da ist etwas schiefgelaufen. Bitte versuche es erneut.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Anmelden';
      });
    });

    document.getElementById('payNowBtn').addEventListener('click', function() {
      var btn = this;
      btn.disabled = true;
      btn.textContent = 'Wird verarbeitet …';

      if (DEMO_MODE) {
        sleep(900).then(function() {
          backendMarkDemoPaid(pendingEntry.id);
          localStorage.removeItem('loc_pending_' + t.id);
          finishConfirmation('bezahlt');
        });
        return;
      }

      var successPath = 'event/' + t.id + '/register/' + encodeURIComponent(competition) + '?paid=' + pendingEntry.id;
      var cancelPath = 'event/' + t.id + '/register/' + encodeURIComponent(competition) + '?resume=' + pendingEntry.id;
      backendCreateCheckout(pendingEntry.id, t.id, successPath, cancelPath).then(function(res) {
        if (res && res.url) { window.location.href = res.url; }
        else { document.getElementById('regError').textContent = 'Zahlung konnte nicht gestartet werden.'; btn.disabled = false; btn.textContent = 'Startgebühr jetzt bezahlen'; }
      });
    });

    document.getElementById('payLaterBtn').addEventListener('click', function() {
      document.getElementById('paymentStep').hidden = true;
      document.getElementById('pendingConfirm').hidden = true;
      navigate('event/' + t.id);
    });

    // Rückkehr von Stripe Checkout (?paid=<id>&session_id=...)
    if (query && query.paid && query.session_id) {
      backendConfirmPayment(query.paid, query.session_id).then(function(res) {
        localStorage.removeItem('loc_pending_' + t.id);
        finishConfirmation(res && res.status === 'bezahlt' ? 'bezahlt' : 'pending');
      });
    }

    function finishConfirmation(status) {
      document.getElementById('regForm').hidden = true;
      document.getElementById('pendingConfirm').hidden = true;
      document.getElementById('paymentStep').hidden = true;
      var conf = document.getElementById('regConfirm');
      conf.hidden = false;
      if (status === 'bezahlt') {
        conf.innerHTML = '<div class="confirm-icon confirm-paid">✓</div><h2>Anmeldung bestätigt!</h2><p>Euer Team ist startberechtigt. Bis bald auf dem Court!</p><button class="btn btn-outline" id="confBack">Zurück zum Turnier</button>';
      } else {
        conf.innerHTML = '<div class="confirm-icon confirm-pending">⏳</div><h2>Zahlung noch ausstehend</h2><p>Wir konnten die Zahlung noch nicht bestätigen. Ihr könnt es auf der Turnierseite erneut versuchen.</p><button class="btn btn-outline" id="confBack">Zurück zum Turnier</button>';
      }
      document.getElementById('confBack').addEventListener('click', function(){ navigate('event/' + t.id); });
    }

    setView('register');
  }

  /* ==================================================================
     RANKING
     ================================================================== */
  function showRanking() {
    var el = document.getElementById('rankingContent');
    el.innerHTML = '<div class="ranking-head"><h1>Rangliste</h1><p>Punktestand der Saison 2026, laufend aktualisiert.</p></div><div class="ranking-groups" id="rankingGroups"></div>';
    backendRanking().then(function(res) {
      var groupsEl = document.getElementById('rankingGroups');
      if (!groupsEl) return;
      if (res.demo) {
        el.querySelector('.ranking-head').insertAdjacentHTML('beforeend', '<span class="demo-tag mono">Beispieldaten – Demo-Modus</span>');
      }
      var comps = ['Herren','Damen'];
      var byComp = {};
      comps.forEach(function(c){ byComp[c] = []; });
      (res.rows || []).forEach(function(r) { if (byComp[r.competition]) byComp[r.competition].push(r); });

      var html = comps.map(function(comp) {
        var rows = byComp[comp].sort(function(a,b){ return b.punkte - a.punkte; });
        if (!rows.length) {
          return '<div class="ranking-table-wrap"><h3>' + comp + 'bewerb</h3><p class="empty-note" style="padding:18px;">Rangliste wird nach dem ersten Turnier veröffentlicht.</p></div>';
        }
        return '<div class="ranking-table-wrap"><h3>' + comp + 'bewerb</h3><table class="ranking"><thead><tr><th></th><th>Name</th><th>Verein</th><th style="text-align:right">Punkte</th></tr></thead><tbody>' +
          rows.map(function(r, i) {
            return '<tr><td class="rank mono">' + (i+1) + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.verein) + '</td><td class="pts mono">' + r.punkte + '</td></tr>';
          }).join('') + '</tbody></table></div>';
      }).join('');
      groupsEl.innerHTML = html;
    });
    setView('ranking');
  }

     ================================================================== */

      '<h2>Vertretungsberechtigt</h2>' +
      '<p class="placeholder-field">[Name der vertretungsberechtigten Person]</p>' +
      '<h2>Unternehmensgegenstand</h2>' +

      '<h2>Aufsichtsbehörde / Kammer</h2>' +

  /* ==================================================================
     NAV / GLOBAL LISTENERS
     ================================================================== */
  document.getElementById('seasonTag').textContent = 'SAISON 2026 · ' + TOURNAMENTS.length + ' TURNIERE';
  document.getElementById('heroSub').textContent = TOURNAMENTS.length + ' Turniere quer durch Europa, drei Formate – LoC 1000, 500 und 100 – gespielt 2 gegen 2 für euren Verein.';
  document.getElementById('igLink').href = CONFIG.INSTAGRAM_URL;
  document.getElementById('igFootLink').href = CONFIG.INSTAGRAM_URL;
  if (DEMO_MODE) document.getElementById('demoBanner').hidden = false;

  document.getElementById('homeLink').addEventListener('click', function(){ navigate(''); });
  document.querySelectorAll('[data-route]').forEach(function(btn) {
    btn.addEventListener('click', function(){ navigate(btn.dataset.route === 'home' ? '' : btn.dataset.route); });
  });
  document.querySelectorAll('[data-back]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      history.back();
    });
  });
  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      renderGrid(currentFilter);
    });
  });
  grid.addEventListener('click', function(e) {
    var card = e.target.closest('.tcard');
    if (card) navigate('event/' + card.dataset.id);
  });

  window.addEventListener('hashchange', route);
  route();
})();
</script>
