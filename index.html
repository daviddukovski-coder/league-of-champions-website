<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League of Champions Tour</title>
<meta name="description" content="Tournament overview, info, team registration and ranking for the Footvolley League of Champions Tour.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============ THEME TOKENS ============
     Source: footvolleyleagueofchampions.com + playerloc.com
     Navy #0B0D63, Cyan #00F2FF, Bebas Neue (headlines) / Poppins (UI) ============ */
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f4f5fb;
    --heading: #0b0d63;
    --text: #0b0d63;
    --text-muted: #62649c;
    --border: #e1e2f0;
    --ink-deep: #0b0d63;
    --on-ink: #ffffff;
    --cyan: #00f2ff;
    --cyan-soft: #6bf5ff;
    --cyan-ink: #007a8f;
    --paid: #2f9e6e;
    --pending-text: #a97a1a;
    --pill-bg: #00f2ff;
    --pill-text: #0b0d63;
    --nav-bg: #0b0d63;
    --nav-text: #ffffff;
    --shadow: rgba(11,13,99,0.12);
    --tint-ink: rgba(11,13,99,0.06);
    --tint-paid: rgba(47,158,110,0.13);
    --tint-pending: rgba(228,167,48,0.15);
    --tint-muted: rgba(11,13,99,0.08);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0d63;
      --surface: #14167a;
      --surface-2: #191c8a;
      --heading: #ffffff;
      --text: #f2f2fb;
      --text-muted: #b7b8e2;
      --border: rgba(255,255,255,0.16);
      --shadow: rgba(0,0,0,0.35);
      --tint-ink: rgba(255,255,255,0.08);
      --tint-paid: rgba(47,158,110,0.22);
      --tint-pending: rgba(228,167,48,0.22);
      --tint-muted: rgba(255,255,255,0.10);
      --pending-text: #f0c775;
      --cyan-ink: #00f2ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0d63;
    --surface: #14167a;
    --surface-2: #191c8a;
    --heading: #ffffff;
    --text: #f2f2fb;
    --text-muted: #b7b8e2;
    --border: rgba(255,255,255,0.16);
    --shadow: rgba(0,0,0,0.35);
    --tint-ink: rgba(255,255,255,0.08);
    --tint-paid: rgba(47,158,110,0.22);
    --tint-pending: rgba(228,167,48,0.22);
    --tint-muted: rgba(255,255,255,0.10);
    --pending-text: #f0c775;
    --cyan-ink: #00f2ff;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { font-family:'Poppins','Open Sans',Verdana,Arial,sans-serif; color:var(--text); background:var(--bg); line-height:1.6; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:'Bebas Neue',sans-serif; font-weight:400; letter-spacing:0.5px; line-height:1.08; color:var(--heading); text-wrap:balance; }
  .mono { font-family:'Poppins','Open Sans',Verdana,Arial,sans-serif; letter-spacing:0.4px; }
  a { color:inherit; }
  button { font-family:inherit; cursor:pointer; }
  :focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
  .container { max-width:1080px; margin:0 auto; padding:0 28px; }
  [hidden] { display:none !important; }

  /* ============ NAV ============ */
  .nav { position:sticky; top:0; z-index:50; background:var(--nav-bg); border-bottom:1px solid rgba(255,255,255,0.12); }
  .nav-inner { max-width:1080px; margin:0 auto; padding:16px 28px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .wordmark { display:flex; align-items:center; gap:10px; background:none; border:none; padding:0; }
  .wordmark .badge { width:34px; height:34px; display:block; }
  .wordmark .text { display:flex; flex-direction:column; align-items:flex-start; gap:0; }
  .wordmark .mark { font-family:'Bebas Neue',sans-serif; font-size:20px; line-height:1; letter-spacing:0.5px; color:var(--nav-text); }
  .wordmark .sub { font-size:11px; color:var(--cyan); font-weight:600; letter-spacing:0.5px; }
  .nav-right { display:flex; align-items:center; gap:22px; }
  .nav-links { display:flex; align-items:center; gap:20px; }
  .nav-link { background:none; border:none; font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:0.5px; color:rgba(255,255,255,0.75); padding:4px 0; border-bottom:2px solid transparent; }
  .nav-link:hover { color:var(--nav-text); }
  .nav-link.active { color:var(--nav-text); border-bottom-color:var(--cyan); }
  .ig-link { display:flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%; border:1px solid rgba(255,255,255,0.25); color:rgba(255,255,255,0.8); transition:border-color .15s, color .15s; }
  .ig-link:hover { border-color:var(--cyan); color:var(--cyan); }
  .season-tag { font-size:11px; color:rgba(255,255,255,0.55); letter-spacing:0.5px; }

  /* ============ BUTTONS ============ */
  .btn { display:inline-block; padding:14px 30px; border-radius:30px; font-size:14px; font-weight:600; letter-spacing:0.3px; border:2px solid transparent; transition:transform .15s, background .15s, opacity .15s, border-color .15s; }
  .btn-cyan { background:var(--cyan); color:var(--pill-text); }
  .btn-cyan:hover { background:var(--cyan-soft); transform:translateY(-1px); }
  .btn-cyan:disabled { opacity:0.6; transform:none; cursor:default; }
  .btn-outline { background:transparent; color:var(--cyan-ink); border:2px solid var(--cyan-ink); }
  .btn-outline:hover { background:rgba(0,242,255,0.08); }
  .btn-block { width:100%; text-align:center; }
  .btn-ghost { background:none; border:none; color:var(--text-muted); font-size:13px; font-weight:600; text-decoration:underline; text-underline-offset:3px; }
  .btn-ghost:hover { color:var(--heading); }
  .back-btn { background:none; border:none; color:var(--text-muted); font-size:13px; font-weight:600; padding:24px 0 4px; }
  .back-btn:hover { color:var(--heading); }

  main { min-height:60vh; }

  .demo-banner { background:var(--tint-pending); color:var(--pending-text); font-size:12.5px; font-weight:600; text-align:center; padding:9px 16px; }

  /* ============ HOME ============ */
  .home-hero { padding:56px 0 36px; }
  .home-hero h1 { font-size:clamp(30px,4.5vw,44px); max-width:680px; margin-bottom:14px; }
  .home-hero p { color:var(--text-muted); font-size:16px; max-width:560px; }
  .tabs { display:flex; gap:8px; padding:8px 0 28px; flex-wrap:wrap; }
  .tab { background:var(--surface); border:1px solid var(--border); padding:10px 18px; border-radius:20px; font-size:13px; font-weight:600; color:var(--text-muted); }
  .tab.active { background:var(--pill-bg); color:var(--pill-text); border-color:var(--pill-bg); }
  .tournament-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; padding-bottom:80px; }
  .tcard { text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px; display:flex; flex-direction:column; gap:10px; transition:transform .15s, box-shadow .15s; }
  .tcard:hover { transform:translateY(-3px); box-shadow:0 10px 28px var(--shadow); }
  .tcard-top { display:flex; justify-content:space-between; align-items:center; }
  .tier { font-family:'Poppins','Open Sans',Verdana,Arial,sans-serif; font-size:11px; font-weight:600; color:var(--heading); background:var(--tint-ink); padding:4px 9px; border-radius:12px; }
  .badge { font-size:10.5px; font-weight:600; letter-spacing:0.4px; padding:4px 9px; border-radius:12px; text-transform:uppercase; }
  .badge-upcoming { background:var(--tint-paid); color:var(--paid); }
  .badge-past { background:var(--tint-muted); color:var(--text-muted); }
  .tcard h3 { font-size:19px; }
  .tcard-meta { display:flex; flex-direction:column; gap:3px; font-size:12.5px; color:var(--text-muted); }
  .tcard-cat { font-size:12.5px; color:var(--text-muted); }
  .tcard-count { font-size:11.5px; color:var(--cyan-ink); font-weight:600; margin-top:2px; }

  /* ============ EVENT IMAGE ============ */
  .event-image { width:100%; aspect-ratio:16/7; border-radius:var(--radius); overflow:hidden; margin-bottom:24px; background:radial-gradient(120% 140% at 15% 15%,#191c8a 0%,#0b0d63 55%,#07083f 100%); display:flex; align-items:center; justify-content:center; position:relative; }
  .event-image img { width:100%; height:100%; object-fit:cover; display:block; }
  .event-image .ph-tier { font-family:'Bebas Neue',sans-serif; font-weight:400; color:rgba(0,242,255,0.28); font-size:clamp(40px,9vw,90px); letter-spacing:3px; }
  .event-image .ph-tag { position:absolute; bottom:14px; left:16px; font-family:'Poppins','Open Sans',Verdana,Arial,sans-serif; font-size:11px; color:rgba(255,255,255,0.6); }

  /* ============ DETAIL ============ */
  .detail-head { padding-top:6px; margin-bottom:28px; }
  .detail-head h1 { font-size:clamp(28px,4vw,40px); margin:10px 0 8px; }
  .detail-meta { color:var(--text-muted); font-size:14px; }
  .detail-info-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:28px; }
  .info-block { background:var(--surface); padding:18px 20px; display:flex; flex-direction:column; gap:6px; }
  .info-block .label { font-family:'Poppins','Open Sans',Verdana,Arial,sans-serif; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); }
  .info-block .value { font-weight:600; color:var(--heading); font-size:15px; }
  .closed-note { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; color:var(--text-muted); font-size:14px; margin-bottom:28px; }
  .resume-banner { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px; background:var(--tint-pending); border:1px solid var(--cyan); border-radius:var(--radius); padding:16px 20px; margin-bottom:28px; }
  .resume-banner p { font-size:13.5px; color:var(--pending-text); font-weight:600; }
  .comp-actions { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .section-title { font-size:20px; margin:44px 0 14px; }
  .section-title:first-of-type { margin-top:0; }
  .player-list { display:flex; flex-direction:column; gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:20px; }
  .player-row { background:var(--surface); padding:14px 18px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .player-club { display:block; font-size:12.5px; color:var(--text-muted); margin-top:2px; }
  .status { font-size:11px; font-weight:600; padding:4px 10px; border-radius:12px; white-space:nowrap; }
  .status-paid { background:var(--tint-paid); color:var(--paid); }
  .status-pending { background:var(--tint-pending); color:var(--pending-text); }
  .empty-note { color:var(--text-muted); font-size:14px; padding:4px 0 40px; }

  /* ============ COMPETITION SELECT ============ */
  .comp-select-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; max-width:640px; padding-bottom:60px; }
  .comp-card { text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:28px; display:flex; flex-direction:column; gap:8px; transition:transform .15s, box-shadow .15s, border-color .15s; }
  .comp-card:hover { transform:translateY(-3px); box-shadow:0 10px 28px var(--shadow); border-color:var(--cyan); }
  .comp-card h3 { font-size:20px; }
  .comp-card span { color:var(--text-muted); font-size:13px; }

  /* ============ REGISTER ============ */
  .register-inner { max-width:560px; margin:0 auto; padding-bottom:80px; }
  .register-head { padding:6px 0 28px; }
  .eyebrow { display:block; color:var(--cyan-ink); font-weight:600; letter-spacing:0.5px; margin-bottom:10px; font-size:12px; text-transform:uppercase; }
  .register-head h1 { font-size:30px; }
  form { border:1px solid var(--border); background:var(--surface); border-radius:var(--radius); padding:32px; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .form-group { display:flex; flex-direction:column; gap:6px; margin-bottom:18px; position:relative; }
  .form-row .form-group { margin-bottom:0; }
  label { font-size:12px; font-weight:600; }
  input, select { font-family:'Inter',sans-serif; font-size:15px; padding:12px 13px; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg); color:var(--text); width:100%; transition:border-color .15s; }
  input:focus, select:focus { outline:none; border-color:var(--cyan); }
  .combo-group { margin-bottom:18px; }
  .combo-dropdown { position:absolute; top:100%; left:0; right:0; margin-top:4px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:0 12px 24px var(--shadow); max-height:260px; overflow-y:auto; z-index:10; }
  .combo-item { display:flex; align-items:center; gap:10px; padding:9px 12px; font-size:14px; cursor:pointer; }
  .combo-item:hover { background:var(--bg); }
  .club-avatar { width:26px; height:26px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:'Poppins','Open Sans',Verdana,Arial,sans-serif; font-size:10px; font-weight:600; color:#fff; overflow:hidden; }
  .club-avatar img { width:100%; height:100%; object-fit:cover; }
  .checkbox-row { display:flex; gap:9px; align-items:flex-start; margin-bottom:24px; cursor:pointer; }
  .checkbox-row input { width:16px; height:16px; margin-top:3px; flex-shrink:0; accent-color:var(--cyan); }
  .checkbox-row span { font-size:12.5px; color:var(--text-muted); }
  .form-error { color:#b3401f; font-size:13px; text-align:center; margin-top:12px; min-height:16px; }

  .pay-summary { border:1px solid var(--border); background:var(--surface); border-radius:var(--radius); padding:26px 28px; margin-bottom:16px; }
  .pay-summary div { display:flex; justify-content:space-between; padding:8px 0; font-size:14px; border-bottom:1px solid var(--border); }
  .pay-summary div:last-child { border-bottom:none; }
  .pay-summary span { color:var(--text-muted); }
  #paymentStep .btn { margin-bottom:10px; }
  .pay-note { text-align:center; font-size:12px; color:var(--text-muted); margin-top:10px; }

  .confirmation { text-align:center; padding:50px 20px; }
  .confirm-icon { width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto 18px; }
  .confirm-paid { background:var(--tint-paid); color:var(--paid); }
  .confirm-pending { background:var(--tint-pending); color:var(--pending-text); }
  .confirmation h2 { font-size:24px; margin-bottom:10px; }
  .confirmation p { color:var(--text-muted); font-size:15px; max-width:380px; margin:0 auto; }
  .confirmation .btn { margin-top:22px; }

  /* ============ RANKING ============ */
  .ranking-head { padding:44px 0 24px; }
  .ranking-head h1 { font-size:clamp(26px,4vw,36px); margin-bottom:8px; }
  .ranking-head p { color:var(--text-muted); font-size:15px; }
  .demo-tag { display:inline-block; margin-top:10px; font-family:'Poppins','Open Sans',Verdana,Arial,sans-serif; font-size:11px; color:var(--pending-text); background:var(--tint-pending); padding:4px 10px; border-radius:12px; }
  .ranking-groups { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:24px; padding-bottom:80px; }
  .ranking-table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); }
  .ranking-table-wrap h3 { padding:16px 18px; border-bottom:1px solid var(--border); font-size:16px; }
  table.ranking { width:100%; border-collapse:collapse; font-size:13.5px; }
  table.ranking th { text-align:left; font-family:'Poppins','Open Sans',Verdana,Arial,sans-serif; font-size:10.5px; letter-spacing:0.6px; text-transform:uppercase; color:var(--text-muted); padding:10px 14px; border-bottom:1px solid var(--border); }
  table.ranking td { padding:11px 14px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; }
  table.ranking tr:last-child td { border-bottom:none; }
  table.ranking td.rank { color:var(--text-muted); width:32px; }
  table.ranking td.pts { text-align:right; font-weight:600; color:var(--heading); }

  /* ============ IMPRINT ============ */
  .prose { max-width:640px; padding:44px 0 90px; }
  .prose h1 { font-size:clamp(26px,4vw,34px); margin-bottom:24px; }
  .prose h2 { font-size:16px; margin:28px 0 8px; }
  .prose p, .prose li { font-size:14.5px; color:var(--text-muted); }
  .prose ul { padding-left:20px; margin-top:4px; }
  .prose a { color:var(--heading); text-decoration:underline; text-underline-offset:3px; }
  .placeholder-field { color:var(--cyan-ink); }

  footer { background:var(--ink-deep); padding:44px 28px; text-align:center; margin-top:40px; }
  footer .badge { width:88px; height:88px; display:block; margin:0 auto 14px; }
  footer .mark { color:var(--on-ink); font-family:'Bebas Neue',sans-serif; font-weight:700; }
  footer .sub { color:var(--cyan); font-family:'Poppins','Open Sans',Verdana,Arial,sans-serif; font-size:11px; }
  footer p { color:rgba(245,243,236,0.55); font-size:13px; margin-top:12px; }
  footer a { color:var(--cyan-soft); }
  footer .foot-links { margin-top:18px; display:flex; gap:18px; justify-content:center; flex-wrap:wrap; }
  footer .foot-links button, footer .foot-links a { background:none; border:none; color:rgba(245,243,236,0.65); font-size:12.5px; font-weight:600; }
  footer .foot-links button:hover, footer .foot-links a:hover { color:var(--cyan-soft); }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } * { transition:none !important; } }
  @media (max-width:640px) {
    .form-row { grid-template-columns:1fr; gap:0; }
    form { padding:22px; }
    .tabs { flex-wrap:wrap; }
    .nav-inner { padding:14px 20px; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <button class="wordmark" id="homeLink">
      <img class="badge" src="assets/flc-logo-white.png" alt="">
      <span class="text"><span class="mark">LEAGUE OF CHAMPIONS</span><span class="sub mono">FOOTVOLLEY</span></span>
    </button>
    <div class="nav-right">
      <div class="nav-links">
        <button class="nav-link" data-route="home">Tournaments</button>
        <button class="nav-link" data-route="ranking">Ranking</button>
        <button class="nav-link" data-route="impressum">Imprint</button>
      </div>
      <a class="ig-link" id="igLink" href="#" target="_blank" rel="noopener" aria-label="Instagram">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor" stroke="none"/></svg>
      </a>
      <span class="season-tag" id="seasonTag"></span>
    </div>
  </div>
</nav>

<main>
  <div id="demoBanner" class="demo-banner" hidden>DEMO MODE – registrations are only stored locally in this browser (no real backend connected)</div>

  <section id="view-home" class="view">
    <div class="container">
      <div class="home-hero">
        <h1>Europe's biggest footvolley tour</h1>
        <p id="heroSub"></p>
      </div>
      <div class="tabs">
        <button class="tab active" data-filter="upcoming">Upcoming Tournaments</button>
        <button class="tab" data-filter="past">Past Tournaments</button>
      </div>
      <div id="tournamentGrid" class="tournament-grid"></div>
    </div>
  </section>

  <section id="view-detail" class="view" hidden>
    <div class="container">
      <button class="back-btn" data-back="home">← All Tournaments</button>
      <div id="detailContent"></div>
    </div>
  </section>

  <section id="view-compselect" class="view" hidden>
    <div class="container">
      <button class="back-btn" data-back="detail">← Back to Tournament</button>
      <div id="compSelectContent"></div>
    </div>
  </section>

  <section id="view-register" class="view" hidden>
    <div class="container">
      <button class="back-btn" data-back="detail">← Back to Tournament</button>
      <div class="register-inner" id="registerContent"></div>
    </div>
  </section>

  <section id="view-ranking" class="view" hidden>
    <div class="container">
      <div id="rankingContent"></div>
    </div>
  </section>

  <section id="view-impressum" class="view" hidden>
    <div class="container">
      <div class="prose" id="impressumContent"></div>
    </div>
  </section>
</main>

<footer>
  <img class="badge" src="assets/flc-logo-white.png" alt="Footvolley League of Champions">
  <span class="mark">LEAGUE OF CHAMPIONS</span> <span class="sub mono">FOOTVOLLEY</span>
  <p>Questions? <a href="mailto:office@bolao-sports.com">office@bolao-sports.com</a> · <a href="tel:+436606577498">+43 660 6577498</a></p>

  function avatarColor(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }
  function initials(name) {
    return name.split(/\s+/).filter(Boolean).slice(0,2).map(function(w){ return w[0]; }).join('').toUpperCase();

  function sleep(ms) { return new Promise(function(res){ setTimeout(res, ms); }); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  /* ==================================================================
     BACKEND LAYER (real Apps Script API or local demo fallback)
     ================================================================== */
  function apiGet(action, params) {
    var qs = Object.keys(params || {}).map(function(k){ return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
    return fetch(CONFIG.API_URL + '?action=' + action + (qs ? '&' + qs : '')).then(function(r){ return r.json(); });
  }
  function apiPost(action, body) {
    var payload = Object.assign({ action: action }, body);
    return fetch(CONFIG.API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) }).then(function(r){ return r.json(); });
  }

  function demoAll() {
    try { return JSON.parse(localStorage.getItem('loc_demo_regs') || '[]'); } catch (e) { return []; }
  }
  function demoSave(list) { localStorage.setItem('loc_demo_regs', JSON.stringify(list)); }

  function backendListRegistrations(tournamentId) {
    if (DEMO_MODE) {
      return Promise.resolve(demoAll().filter(function(r){ return r.tournamentId === tournamentId; }));
    }
    return apiGet('list', { tournamentId: tournamentId }).catch(function(){ return []; });
  }
  function backendRegister(payload) {
    if (DEMO_MODE) {
      var id = Date.now() + '-' + rand();
      var entry = Object.assign({ id:id, status:'pending', timestamp:new Date().toISOString() }, payload);
      var list = demoAll(); list.push(entry); demoSave(list);
      return Promise.resolve({ ok:true, id:id });
    }
    return apiPost('register', payload);
  }
  function backendCreateCheckout(id, tournamentId, successPath, cancelPath) {
    if (DEMO_MODE) return Promise.resolve({ ok:true, demo:true });
    return apiPost('createCheckout', { id:id, tournamentId:tournamentId, successPath:successPath, cancelPath:cancelPath });
  }
  function backendConfirmPayment(id, sessionId) {
    if (DEMO_MODE) return Promise.resolve({ ok:true, status:'paid' });
    return apiPost('confirmPayment', { id:id, sessionId:sessionId });
  }
  function backendMarkDemoPaid(id) {
    var list = demoAll();
    var e = list.find(function(r){ return r.id === id; });
    if (e) { e.status = 'paid'; demoSave(list); }
  }
  function backendStatus(id) {
    if (DEMO_MODE) {
      var e = demoAll().find(function(r){ return r.id === id; });
      return Promise.resolve(e ? { status:e.status } : { error:'not found' });
    }
    return apiGet('status', { id:id });

  /* ==================================================================
     ROUTER
     ================================================================== */
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var currentFilter = 'upcoming';

  function setView(view) {
    ['home','detail','compselect','register','ranking','impressum'].forEach(function(v) {
      document.getElementById('view-' + v).hidden = v !== view;
    });
    document.querySelectorAll('.nav-link').forEach(function(l) {
      l.classList.toggle('active', l.dataset.route === (view === 'home' ? 'home' : view === 'ranking' ? 'ranking' : view === 'impressum' ? 'impressum' : ''));
    });
    window.scrollTo({ top:0, behavior: reduceMotion ? 'auto' : 'smooth' });
  }

  function parseHash() {
    var raw = location.hash.replace(/^#\/?/, '');
    var qIndex = raw.indexOf('?');
    var path = qIndex === -1 ? raw : raw.slice(0, qIndex);
    var query = {};
    if (qIndex !== -1) {
      raw.slice(qIndex + 1).split('&').forEach(function(pair) {
        if (!pair) return;
        var kv = pair.split('=');
        query[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
      });
    }
    return { parts: path.split('/').filter(Boolean), query: query };
  }

  function navigate(path) { location.hash = '#/' + path; }

  function route() {
    var h = parseHash();
    var p = h.parts;
    if (p[0] === 'event' && p[1]) {
      var t = tourById(p[1]);
      if (!t) { navigate(''); return; }
      if (p[2] === 'register') {
        var comp = decodeURIComponent(p[3] || t.competitions[0]);
        showRegister(t, comp, h.query);
      } else if (p[2] === 'compselect') {
        showCompSelect(t);
      } else {
        showDetail(t);
      }
    } else if (p[0] === 'ranking') {
      showRanking();
    } else if (p[0] === 'impressum') {
      showImpressum();
    } else {
      renderGrid(currentFilter);
      setView('home');
    }
  }

  /* ==================================================================
     HOME
     ================================================================== */
  var grid = document.getElementById('tournamentGrid');

  function renderCard(t) {
    var statusBadge = t.status === 'upcoming'
      ? '<span class="badge badge-upcoming">Registration open</span>'
      : '<span class="badge badge-past">Completed</span>';
    var countSpan = t.status === 'upcoming' ? '<span class="tcard-count mono" data-count-for="' + t.id + '"></span>' : '';
    return (
      '<button class="tcard" data-id="' + t.id + '">' +
        '<div class="tcard-top"><span class="tier mono">LoC ' + t.tier + '</span>' + statusBadge + '</div>' +
        '<h3>' + esc(t.name) + '</h3>' +
        '<div class="tcard-meta mono"><span>' + t.dateLabel + '</span><span>' + t.flag + ' ' + esc(t.city) + ', ' + esc(t.country) + '</span></div>' +
        '<div class="tcard-cat">' + esc(divisionsText(t)) + '</div>' +
        countSpan +
      '</button>'
    );
  }

  function renderGrid(filter) {
    var list = TOURNAMENTS.filter(function(t){ return t.status === filter; })
      .sort(function(a,b){ return a.dateSort.localeCompare(b.dateSort); });
    grid.innerHTML = list.map(renderCard).join('');
    if (filter === 'upcoming') loadCounts();
  }

  function loadCounts() {
    var upcoming = TOURNAMENTS.filter(function(t){ return t.status === 'upcoming'; });
    upcoming.forEach(function(t) {
      backendListRegistrations(t.id).then(function(list) {
        var el = document.querySelector('[data-count-for="' + t.id + '"]');
        if (el && list.length > 0) el.textContent = list.length + (list.length === 1 ? ' team registered' : ' teams registered');
      });
    });
  }

  /* ==================================================================
     DETAIL
     ================================================================== */
  var detailContent = document.getElementById('detailContent');

  function renderPlayerList(players) {
    if (!players.length) return '<p class="empty-note">No registrations yet – be the first team!</p>';
    return '<div class="player-list">' + players.map(function(p) {
      var statusClass = p.status === 'paid' ? 'status-paid' : 'status-pending';
      var statusLabel = p.status === 'paid' ? 'Paid' : 'Pending';
      return (
        '<div class="player-row">' +
          '<div><strong>' + esc(p.firstName) + ' ' + esc(p.lastName) + '</strong> &amp; ' + esc(p.partner) +
          '<span class="player-club">' + esc(p.club) + '</span></div>' +
          '<span class="status ' + statusClass + '">' + statusLabel + '</span>' +
        '</div>'
      );
    }).join('') + '</div>';
  }

  function eventImageHtml(t) {
    if (t.image) return '<div class="event-image"><img src="' + esc(t.image) + '" alt="' + esc(t.name) + '"></div>';
    return '<div class="event-image"><span class="ph-tier mono">LoC ' + t.tier + '</span><span class="ph-tag mono">' + esc(t.city) + ' · ' + t.dateLabel + '</span></div>';
  }

  function showDetail(t) {
    var infoRows =
      '<div class="detail-info-grid">' +
        '<div class="info-block"><span class="label">Format</span><span class="value">2v2</span></div>' +
        '<div class="info-block"><span class="label">Entry fee</span><span class="value">' + (t.fee ? '€' + t.fee + ' / team' : '–') + '</span></div>' +
        '<div class="info-block"><span class="label">Registration deadline</span><span class="value">' + (t.deadline || '–') + '</span></div>' +
        '<div class="info-block"><span class="label">Divisions</span><span class="value">' + esc(divisionsText(t)) + '</span></div>' +
      '</div>';

    detailContent.innerHTML =
      eventImageHtml(t) +
      '<div class="detail-head">' +
        '<span class="tier mono">LoC ' + t.tier + '</span>' +
        '<h1>' + esc(t.name) + '</h1>' +
        '<div class="detail-meta mono">' + t.dateLabel + ' 2026 · ' + t.flag + ' ' + esc(t.city) + ', ' + esc(t.country) + '</div>' +
      '</div>' + infoRows + '<div id="detailBody"></div>';

    var body = document.getElementById('detailBody');

    if (t.status !== 'upcoming') {
      body.innerHTML = '<div class="closed-note">Registration for this tournament is closed.</div>';
      setView('detail');
      return;
    }

    var actionsHtml = t.competitions.length > 1
      ? '<button class="btn btn-cyan" id="goRegisterBtn">Register now</button>'
      : '<button class="btn btn-cyan" id="goRegisterBtn">Register now – ' + esc(divisionLabel(t.competitions[0])) + '</button>';

    body.innerHTML = '<div id="resumeSlot"></div><div class="comp-actions">' + actionsHtml + '</div><div id="playerLists"></div>';

    document.getElementById('goRegisterBtn').addEventListener('click', function() {
      if (t.competitions.length > 1) navigate('event/' + t.id + '/compselect');
      else navigate('event/' + t.id + '/register/' + encodeURIComponent(t.competitions[0]));
    });

    checkResumablePayment(t);

    backendListRegistrations(t.id).then(function(all) {
      var listsEl = document.getElementById('playerLists');
      if (!listsEl) return;
      if (t.competitions.length > 1) {
        listsEl.innerHTML = t.competitions.map(function(comp) {
          var players = all.filter(function(p){ return p.competition === comp; });
          return '<h2 class="section-title">' + esc(divisionLabel(comp)) + ' – Registered Teams</h2>' + renderPlayerList(players);
        }).join('');
      } else {
        listsEl.innerHTML = '<h2 class="section-title">Registered Teams</h2>' + renderPlayerList(all);
      }
    });

    setView('detail');
  }

  function checkResumablePayment(t) {
    var pendingId = localStorage.getItem('loc_pending_' + t.id);
    var slot = document.getElementById('resumeSlot');
    if (!pendingId || !slot) return;
    backendStatus(pendingId).then(function(res) {
      if (res && res.status === 'pending') {
        slot.innerHTML =
          '<div class="resume-banner">' +
            '<p>You have a pending registration – pay the entry fee now to secure your spot.</p>' +
            '<button class="btn btn-cyan" id="resumePayBtn">Pay now</button>' +
          '</div>';
        document.getElementById('resumePayBtn').addEventListener('click', function() {
          var comp = demoAll().find(function(r){ return r.id === pendingId; });
          var compName = comp ? comp.competition : t.competitions[0];
          navigate('event/' + t.id + '/register/' + encodeURIComponent(compName) + '?resume=' + pendingId);
        });
      } else if (res && res.status === 'paid') {
        localStorage.removeItem('loc_pending_' + t.id);
      }
    });
  }

    compSelectContent.innerHTML =
      '<div class="detail-head"><span class="tier mono">LoC ' + t.tier + '</span><h1>' + esc(t.name) + '</h1><div class="detail-meta mono">Which division would you like to register for?</div></div>' +
      '<div class="comp-select-grid">' +
        t.competitions.map(function(comp) {
          return '<button class="comp-card" data-comp="' + esc(comp) + '"><h3>' + esc(divisionLabel(comp)) + '</h3><span>Team registration (2v2)</span></button>';
        }).join('') +
      '</div>';

      card.addEventListener('click', function() {
        navigate('event/' + t.id + '/register/' + encodeURIComponent(card.dataset.comp));

  /* ==================================================================
     CLUB COMBO
     ================================================================== */
  function clubAvatarHtml(club) {
    if (club.logo) return '<span class="club-avatar"><img src="' + esc(club.logo) + '" alt=""></span>';
    return '<span class="club-avatar" style="background:' + avatarColor(club.name) + '">' + esc(initials(club.name)) + '</span>';
  }

  function setupClubCombo() {
    var search = document.getElementById('rClubSearch');
    var hiddenInput = document.getElementById('rClub');
    var dropdown = document.getElementById('clubDropdown');
    search.addEventListener('input', function() {
      var q = search.value.trim().toLowerCase();
      hiddenInput.value = '';
      if (!q) { dropdown.hidden = true; return; }
      var matches = CLUBS.filter(function(c){ return c.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 8);
      if (!matches.length) { dropdown.hidden = true; return; }
      dropdown.innerHTML = matches.map(function(c){
        return '<div class="combo-item" data-club="' + esc(c.name) + '">' + clubAvatarHtml(c) + '<span>' + esc(c.name) + '</span></div>';
      }).join('');
      dropdown.hidden = false;
    });
    dropdown.addEventListener('click', function(e) {
      var item = e.target.closest('.combo-item');
      if (!item) return;
      search.value = item.dataset.club;
      hiddenInput.value = item.dataset.club;
      dropdown.hidden = true;
    });
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.combo-group')) dropdown.hidden = true;
    });
  }

  /* ==================================================================
     REGISTER
     ================================================================== */
  var registerContent = document.getElementById('registerContent');

  function showRegister(t, competition, query) {
    registerContent.innerHTML =
      '<div class="register-head"><span class="eyebrow mono">' + esc(t.name) + ' · ' + t.dateLabel + ' · ' + esc(divisionLabel(competition)) + '</span><h1>Team Registration</h1></div>' +
      '<form id="regForm">' +
        '<div class="form-row">' +
          '<div class="form-group"><label>First Name *</label><input id="rFirstName" required></div>' +
          '<div class="form-group"><label>Last Name *</label><input id="rLastName" required></div>' +
        '</div>' +
        '<div class="form-row">' +
          '<div class="form-group"><label>Email *</label><input type="email" id="rEmail" required></div>' +
          '<div class="form-group"><label>Phone *</label><input type="tel" id="rPhone" required></div>' +
        '</div>' +
        '<div class="form-group"><label>Partner (2nd Player) *</label><input id="rPartner" required placeholder="First and last name"></div>' +
        '<div class="form-group combo-group">' +
          '<label>Club *</label>' +
          '<input id="rClubSearch" autocomplete="off" placeholder="Search club …" required>' +
          '<div id="clubDropdown" class="combo-dropdown" hidden></div>' +
          '<input type="hidden" id="rClub">' +
        '</div>' +
        '<label class="checkbox-row"><input type="checkbox" id="rConsent" required><span>I agree to the processing of my data for tournament registration. *</span></label>' +
        '<button type="submit" class="btn btn-cyan btn-block">Register</button>' +
        '<p id="regError" class="form-error"></p>' +
      '</form>' +
      '<div id="pendingConfirm" class="confirmation" hidden></div>' +
      '<div id="paymentStep" hidden>' +
        '<div class="pay-summary">' +
          '<div><span>Tournament</span><strong>' + esc(t.name) + '</strong></div>' +
          '<div><span>Division</span><strong>' + esc(divisionLabel(competition)) + '</strong></div>' +
          '<div><span>Team</span><strong id="paySummaryTeam"></strong></div>' +
          '<div><span>Entry fee</span><strong>€' + (t.fee || 0) + '</strong></div>' +
        '</div>' +
        '<button class="btn btn-cyan btn-block" id="payNowBtn">Pay entry fee now</button>' +
        '<button class="btn-ghost" id="payLaterBtn">I\'ll pay later</button>' +
        '<p class="pay-note">Secure payment via Stripe. Registration is only officially confirmed once payment is received.</p>' +
      '</div>' +
      '<div id="regConfirm" class="confirmation" hidden></div>';

    setupClubCombo();

    var pendingEntry = null;

    function showPendingStep(entry) {
      document.getElementById('regForm').hidden = true;
      pendingEntry = entry;
      var pc = document.getElementById('pendingConfirm');
      pc.hidden = false;
      pc.innerHTML =
        '<div class="confirm-icon confirm-pending">✓</div>' +
        '<h2>Provisional Registration Received</h2>' +
        '<p>Your team is on the list. To secure your spot, pay the entry fee now.</p>';
      document.getElementById('paySummaryTeam').textContent = entry.firstName + ' ' + entry.lastName + ' & ' + entry.partner;
      document.getElementById('paymentStep').hidden = false;
    }

    // Resume payment for a previously submitted, still-open registration
    if (query && query.resume) {
      backendStatus(query.resume).then(function(res) {
        if (res && res.status === 'pending') {
          var all = demoAll();
          var found = all.find(function(r){ return r.id === query.resume; });
          showPendingStep(found || { id:query.resume, firstName:'', lastName:'', partner:'' });
        }
      });
    }

    document.getElementById('regForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var err = document.getElementById('regError');
      err.textContent = '';
      var firstName = document.getElementById('rFirstName').value.trim();
      var lastName = document.getElementById('rLastName').value.trim();
      var email = document.getElementById('rEmail').value.trim();
      var phone = document.getElementById('rPhone').value.trim();
      var partner = document.getElementById('rPartner').value.trim();
      var clubHidden = document.getElementById('rClub').value.trim();
      var clubTyped = document.getElementById('rClubSearch').value.trim();
      var club = clubHidden || clubTyped;
      var consent = document.getElementById('rConsent').checked;

      if (!firstName || !lastName || !email || !phone || !partner || !club || !consent) {
        err.textContent = 'Please fill in all required fields.';
        return;
      }

      var submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'One moment …';

      var payload = { tournamentId:t.id, competition:competition, firstName:firstName, lastName:lastName, email:email, phone:phone, partner:partner, club:club };

      backendRegister(payload).then(function(res) {
        if (!res || !res.ok) throw new Error('save failed');
        localStorage.setItem('loc_pending_' + t.id, res.id);
        showPendingStep(Object.assign({ id:res.id }, payload));
      }).catch(function() {
        err.textContent = 'Something went wrong. Please try again.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Register';
      });
    });

    document.getElementById('payNowBtn').addEventListener('click', function() {
      var btn = this;
      btn.disabled = true;
      btn.textContent = 'Processing …';

      if (DEMO_MODE) {
        sleep(900).then(function() {
          backendMarkDemoPaid(pendingEntry.id);
          localStorage.removeItem('loc_pending_' + t.id);
          finishConfirmation('paid');
        });
        return;
      }

      var successPath = 'event/' + t.id + '/register/' + encodeURIComponent(competition) + '?paid=' + pendingEntry.id;
      var cancelPath = 'event/' + t.id + '/register/' + encodeURIComponent(competition) + '?resume=' + pendingEntry.id;
      backendCreateCheckout(pendingEntry.id, t.id, successPath, cancelPath).then(function(res) {
        if (res && res.url) { window.location.href = res.url; }
        else { document.getElementById('regError').textContent = 'Payment could not be started.'; btn.disabled = false; btn.textContent = 'Pay entry fee now'; }
      });
    });

    document.getElementById('payLaterBtn').addEventListener('click', function() {
      document.getElementById('paymentStep').hidden = true;
      document.getElementById('pendingConfirm').hidden = true;
      navigate('event/' + t.id);
    });

    // Returning from Stripe Checkout (?paid=<id>&session_id=...)
    if (query && query.paid && query.session_id) {
      backendConfirmPayment(query.paid, query.session_id).then(function(res) {
        localStorage.removeItem('loc_pending_' + t.id);
        finishConfirmation(res && res.status === 'paid' ? 'paid' : 'pending');
      });
    }

    function finishConfirmation(status) {
      document.getElementById('regForm').hidden = true;
      document.getElementById('pendingConfirm').hidden = true;
      document.getElementById('paymentStep').hidden = true;
      var conf = document.getElementById('regConfirm');
      conf.hidden = false;
      if (status === 'paid') {
        conf.innerHTML = '<div class="confirm-icon confirm-paid">✓</div><h2>Registration Confirmed!</h2><p>Your team is confirmed to play. See you on the court!</p><button class="btn btn-outline" id="confBack">Back to Tournament</button>';
      } else {
        conf.innerHTML = '<div class="confirm-icon confirm-pending">⏳</div><h2>Payment Still Pending</h2><p>We couldn\'t confirm the payment yet. You can try again from the tournament page.</p><button class="btn btn-outline" id="confBack">Back to Tournament</button>';
      }
      document.getElementById('confBack').addEventListener('click', function(){ navigate('event/' + t.id); });
    }

    setView('register');
  }

  /* ==================================================================
     RANKING
     ================================================================== */
  function showRanking() {
    var el = document.getElementById('rankingContent');
    el.innerHTML = '<div class="ranking-head"><h1>Ranking</h1><p>2026 season standings, updated continuously.</p></div><div class="ranking-groups" id="rankingGroups"></div>';
    backendRanking().then(function(res) {
      var groupsEl = document.getElementById('rankingGroups');
      if (!groupsEl) return;
      if (res.demo) {
        el.querySelector('.ranking-head').insertAdjacentHTML('beforeend', '<span class="demo-tag mono">Sample data – demo mode</span>');
      }
      var comps = ['Men','Women'];
      var byComp = {};
      comps.forEach(function(c){ byComp[c] = []; });
      (res.rows || []).forEach(function(r) { if (byComp[r.competition]) byComp[r.competition].push(r); });

      var html = comps.map(function(comp) {
        var rows = byComp[comp].sort(function(a,b){ return b.points - a.points; });
        if (!rows.length) {
          return '<div class="ranking-table-wrap"><h3>' + divisionLabel(comp) + '</h3><p class="empty-note" style="padding:18px;">Standings will be published after the first tournament.</p></div>';
        }
        return '<div class="ranking-table-wrap"><h3>' + divisionLabel(comp) + '</h3><table class="ranking"><thead><tr><th></th><th>Name</th><th>Club</th><th style="text-align:right">Points</th></tr></thead><tbody>' +
          rows.map(function(r, i) {
            return '<tr><td class="rank mono">' + (i+1) + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.club) + '</td><td class="pts mono">' + r.points + '</td></tr>';
          }).join('') + '</tbody></table></div>';
      }).join('');
      groupsEl.innerHTML = html;
    });
    setView('ranking');
  }

    setView('impressum');
  }

  /* ==================================================================
     NAV / GLOBAL LISTENERS
     ================================================================== */
  document.getElementById('seasonTag').textContent = 'SEASON 2026 · ' + TOURNAMENTS.length + ' TOURNAMENTS';
  document.getElementById('heroSub').textContent = TOURNAMENTS.length + ' tournaments across Europe, three formats – LoC 1000, 500 and 100 – played 2v2 for your club.';
  document.getElementById('igLink').href = CONFIG.INSTAGRAM_TOUR_URL;
  document.getElementById('igTourLink').href = CONFIG.INSTAGRAM_TOUR_URL;
  document.getElementById('igBolaoLink').href = CONFIG.INSTAGRAM_BOLAO_URL;
  if (DEMO_MODE) document.getElementById('demoBanner').hidden = false;

  document.getElementById('homeLink').addEventListener('click', function(){ navigate(''); });
  document.querySelectorAll('[data-route]').forEach(function(btn) {
    btn.addEventListener('click', function(){ navigate(btn.dataset.route === 'home' ? '' : btn.dataset.route); });
  });
  document.querySelectorAll('[data-back]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      history.back();
    });
  });
  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      renderGrid(currentFilter);
    });
  });
  grid.addEventListener('click', function(e) {
    var card = e.target.closest('.tcard');
    if (card) navigate('event/' + card.dataset.id);
  });

  window.addEventListener('hashchange', route);
  route();
})();
</script>
